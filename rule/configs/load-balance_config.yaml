# 生成时间: 2026-01-06
# 模板类型: 负载均衡模板

# ==========================================================
# 节点信息
# ==========================================================
proxies:
  - {name: 直连, type: direct}

# ==========================================================
# 全局配置 (保持优化状态)
# ==========================================================
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
find-process-mode: 'off'
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

# ==========================================================
# 嗅探配置 (保持不变)
# ==========================================================
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.v2ex.com"
  skip-domain:
    - "+.baidu.com"

# ==========================================================
# 入站配置 (保持不变)
# ==========================================================
tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# ==========================================================
# DNS配置 (保持不变)
# ==========================================================
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "rule-set:private_domain,cn_domain"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
  default-nameserver:
   - 223.5.5.5
   - 223.6.6.6
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver:
    - 8.8.8.8
    - 1.1.1.1

# ==========================================================
# 锚点配置 - 修复：使用正确的YAML字典格式
# ==========================================================
rule-anchor:
  ip: &ip
    type: http
    interval: 86400
    behavior: ipcidr
    format: mrs
  domain: &domain
    type: http
    interval: 86400
    behavior: domain
    format: mrs
  class: &class
    type: http
    interval: 86400
    behavior: classical
    format: text

# ==========================================================
# 出站策略 (Proxy Groups) - 负载均衡核心修改区
# ==========================================================
proxy-groups:
  # --- 1. 默认与总控 ---
  # 默认代理现在优先指向 [⚖️ 全球均衡]，实现全网加速
  - {name: 🚀 默认代理, type: select, include-all: true, filter: "^((?!(直连)).)*$", proxies: [⚖️ 全球均衡, 🇭🇰 香港均衡, 🇯🇵 日本均衡, 🇺🇸 美国均衡, 🇸🇬 新加坡均衡, 📥 极速下载, ⚡ 自动选择]}
  
  # --- 2. 负载均衡策略组 (核心) ---
  # [一致性哈希]：相同域名走相同节点，防止跳IP，适合日常使用
  - {name: ⚖️ 全球均衡, type: load-balance, strategy: consistent-hashing, include-all: true, filter: "^((?!(直连)).)*$", url: 'http://www.gstatic.com/generate_204', interval: 300}
  
  - {name: 🇭🇰 香港均衡, type: load-balance, strategy: consistent-hashing, include-all: true, filter: "(?i)香港|HK|Hong Kong|HongKong|HKSAR|HKG", url: 'http://www.gstatic.com/generate_204', interval: 300}
  - {name: 🇯🇵 日本均衡, type: load-balance, strategy: consistent-hashing, include-all: true, filter: "(?i)日本|JP|Japan|Tokyo|Osaka", url: 'http://www.gstatic.com/generate_204', interval: 300}
  - {name: 🇺🇸 美国均衡, type: load-balance, strategy: consistent-hashing, include-all: true, filter: "(?i)美国|US|USA|United States", url: 'http://www.gstatic.com/generate_204', interval: 300}
  - {name: 🇸🇬 新加坡均衡, type: load-balance, strategy: consistent-hashing, include-all: true, filter: "(?i)新加坡|SG|Singapore", url: 'http://www.gstatic.com/generate_204', interval: 300}

  # [轮询策略]：适合纯下载工具（IDM, BitTorrent），不考虑IP一致性，只求速度叠加
  - {name: 📥 极速下载, type: load-balance, strategy: round-robin, include-all: true, filter: "^((?!(直连|剩余|到期|重置)).)*$", url: 'http://www.gstatic.com/generate_204', interval: 300}

  # --- 3. 业务分流 (指向均衡组) ---
  # AI 服务建议依然使用"自动选择(url-test)"或指定国家均衡，因为 AI 对 IP 变动极其敏感
  - {name: 🤖 OpenAI, type: select, proxies: [🇺🇸 美国均衡, 🇯🇵 日本均衡, 🇸🇬 新加坡均衡, ⚡ 自动选择]}
  - {name: ✨ Gemini, type: select, proxies: [🇺🇸 美国均衡, 🇯🇵 日本均衡, 🇸🇬 新加坡均衡, ⚡ 自动选择]}
  
  # 社交媒体使用均衡组，加载图片视频会更快
  - {name: 📲 Telegram, type: select, proxies: [⚖️ 全球均衡, 🇭🇰 香港均衡, 🇯🇵 日本均衡, 🇺🇸 美国均衡, 🇸🇬 新加坡均衡]}
  - {name: 🎬 YouTube, type: select, proxies: [⚖️ 全球均衡, 🇭🇰 香港均衡, 🇯🇵 日本均衡, 🇺🇸 美国均衡, 🇸🇬 新加坡均衡]}
  - {name: 🎥 Netflix, type: select, proxies: [🇸🇬 新加坡均衡, 🇹🇼 台湾自动, ⚡ 自动选择]} # Netflix 建议保守，用自动选择或指定单节点，避免版权区跳变
  
  # --- 4. 传统自动选优 (保留作为备用) ---
  - {name: ⚡ 自动选择, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "^((?!(直连)).)*$"}
  - {name: 🇹🇼 台湾自动, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?i)台湾|TW|Taiwan"} # 台湾节点通常较少，做均衡意义不大，保留自动测速

# ==========================================================
# 规则匹配 (Rules)
# ==========================================================
rules:
  - RULE-SET,category-ads-all,REJECT
  - RULE-SET,private_domain,DIRECT
  - GEOIP,LAN,DIRECT

  # 1. 重点应用走指定策略
  - RULE-SET,openai,🤖 OpenAI
  - RULE-SET,gemini,✨ Gemini
  - RULE-SET,youtube_domain,🎬 YouTube
  - RULE-SET,telegram_domain,📲 Telegram
  - RULE-SET,netflix_domain,🎥 Netflix
  
  # 2. 大流量下载/网盘/Steam下载 走 极速下载(轮询)
  - RULE-SET,steam_domain,📥 极速下载
  - RULE-SET,onedrive_domain,📥 极速下载
  - DOMAIN-SUFFIX,download.microsoft.com,📥 极速下载
  
  # 3. 国内直连
  - RULE-SET,cn_domain,DIRECT
  - RULE-SET,cn_ip,DIRECT,no-resolve
  
  # 4. 兜底策略：走全球负载均衡
  - MATCH,🚀 默认代理

# ==========================================================
# 规则源 (保持正确的字典格式)
# ==========================================================
rule-providers:
  private_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs"
  category-ads-all:
