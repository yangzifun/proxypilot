  - {name: 📺 更多流媒体, type: select, proxies: [⚡ 自动选择, 🔗 链式日本, 🔗 链式新加坡, 🇺🇸 美国, 🇨🇳 港澳, 🇯🇵 日本, 🇸🇬 新加坡, 🇩🇪 德国]}
