  - {name: 🐦 Twitter, type: select, proxies: [🚀 默认代理, 🇨🇳 港澳, 🇺🇸 美国, 🇸🇬 新加坡, 🇯🇵 日本, 🇹🇼 中国台湾, 🇩🇪 德国]}
  - {name: 💬 Discord, type: select, proxies: [🚀 默认代理, 🇨🇳 港澳, 🇺🇸 美国, 🇸🇬 新加坡, 🇯🇵 日本, 🇹🇼 中国台湾, 🇩🇪 德国]}
  - {name: 🐱 GitHub, type: select, proxies: [⚡ 自动选择, 🇨🇳 港澳, 🇺🇸 美国, 🇸🇬 新加坡, 🇯🇵 日本, 🇹🇼 中国台湾, 🇩🇪 德国]}
  - {name: 🟦 Microsoft, type: select, proxies: [DIRECT, 🚀 默认代理, ⚡ 自动选择]}

