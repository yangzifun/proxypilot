  - {name: 🎥 Netflix, type: select, proxies: [⚡ 自动选择, 🇺🇸 美国, 🇨🇳 港澳, 🇯🇵 日本, 🇸🇬 新加坡, 🇩🇪 德国, 🔗 链式日本, 🔗 链式新加坡]}
