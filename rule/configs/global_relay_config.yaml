# 更新时间: 2026-03-13
# 模板类型: 全球上网链式代理增强版 - 住宅节点与中转优化
# 作者: YZFN
# ==========================================================
# 节点信息 (请在此处粘贴您的订阅链接解析后的节点)
# ==========================================================
proxies:
  - {name: 直连, type: direct}

# ==========================================================
# 全局配置 
# ==========================================================
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
bind-address: "*"
ipv6: false 
unified-delay: true
tcp-concurrent: true
log-level: warning
find-process-mode: 'off'
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
disable-keep-alive: false
profile:
  store-selected: true
  store-fake-ip: true

# ==========================================================
# 嗅探与入站
# ==========================================================
sniffer:
  enable: true
  sniff:
    HTTP: {ports: [80, 8080-8880], override-destination: true}
    TLS: {ports: [443, 8443]}
    QUIC: {ports: [443, 8443]}
  skip-domain: ["Mijia Cloud", "dlg.io.mi.com", "+.baidu.com", "+.apple.com"]

tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# ==========================================================
# DNS 模块
# ==========================================================
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  fake-ip-range: 28.0.0.1/8
  enhanced-mode: fake-ip
  fake-ip-filter: ["rule-set:private_domain,cn_domain", "+.msftconnecttest.com", "+.msftncsi.com", "time.*.com"]
  default-nameserver: [223.5.5.5, 119.29.29.29]
  proxy-server-nameserver: [https://dns.alidns.com/dns-query]
  nameserver: [https://dns.alidns.com/dns-query, https://doh.pub/dns-query]
  nameserver-policy:
    "geosite:cn,private": [https://dns.alidns.com/dns-query, https://doh.pub/dns-query]
    "geosite:geolocation-!cn": [https://dns.cloudflare.com/dns-query, https://dns.google/dns-query]

# ==========================================================
# 锚点配置
# ==========================================================
rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  class: &class {type: http, interval: 86400, behavior: classical, format: text}

# ==========================================================
# 出站策略 (Proxy Groups)
# ==========================================================
proxy-groups:
  # --- 1. 基础地域自动选择 (作为候选池) ---
  - {name: 🇨🇳 港澳, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?i)香港|澳门|澳門"}
  - {name: 🇯🇵 日本, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?i)日本|东京|大阪|埼玉|京都|福冈|名古屋|札幌"}
  - {name: 🇺🇸 美国, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?i)美国|弗吉尼亚|维吉尼亚|阿什本|洛杉矶|旧金山|圣何塞|加州|纽约|新泽西|德克萨斯|德州|达拉斯|休斯顿|西雅图|芝加哥|佛罗里达|迈阿密|波特兰|拉斯维加斯|凤凰城|亚特兰大|盐湖城|波士顿"}
  - {name: 🇸🇬 新加坡, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?i)新加坡|狮城"}
  - {name: 🇹🇼 中国台湾, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?i)台湾|台北|新北|台中|高雄|台南|桃园|新竹|基隆|嘉义|彰化|屏东|宜兰|花莲|台东|苗栗|南投|云林|澎湖|金门|马祖"}
  - {name: 🇩🇪 德国, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?i)德国|法兰克福|柏林|慕尼黑|汉堡|杜塞尔多夫|科隆|斯图加特|纽伦堡|莱比锡"}

  # --- 2. 🌟 链式代理入口组 ---
  - {name: ⚓ 自动前置, type: url-test, url: 'https://www.gstatic.com/generate_204', include-all: true, tolerance: 10, interval: 300, filter: "(?i)香港|澳门|新加坡|台湾"}
  
  # 新增：住宅Socks组，用于存放手动添加的或订阅中的住宅IP节点
  - {name: 🏠 住宅Socks, type: select, include-all: true, filter: "(?i)住宅|家庭|ISP|Residential|Socks5|Luminati|Oxylabs"}

  # --- 3. 🌟 链式代理配置 (Relay) ---
  # 逻辑：[前置跳板, 最终落地]
  - {name: 🔗 住宅链路, type: relay, proxies: [⚓ 自动前置, 🏠 住宅Socks]}
  - {name: 🔗 链式美国, type: relay, proxies: [⚓ 自动前置, 🇺🇸 美国]}
  - {name: 🔗 链式日本, type: relay, proxies: [⚓ 自动前置, 🇯🇵 日本]}
  - {name: 🔗 链式新加坡, type: relay, proxies: [⚓ 自动前置, 🇸🇬 新加坡]}

  # --- 4. 核心分流开关 ---
  - {name: 🚀 默认代理, type: select, proxies: [⚡ 自动选择, 🇨🇳 港澳, 🇯🇵 日本, 🇺🇸 美国, 🇸🇬 新加坡, 🇹🇼 中国台湾, 🇩🇪 德国]}
  - {name: ⚡ 自动选择, type: url-test, url: 'https://www.gstatic.com/generate_204', include-all: true, tolerance: 20, interval: 300, filter: "^((?!(直连|上海|北京|广州|深圳|杭州|徐州|江苏|浙江|南京|中国|国内|回国|China|Mainland|CN)).)*$"}

  # --- 5. AI 服务 (强烈建议优先使用 🔗 住宅链路 以防封号) ---
  - {name: 🤖 OpenAI, type: select, proxies: [🔗 住宅链路, 🔗 链式美国, 🇺🇸 美国, 🇸🇬 新加坡, 🇯🇵 日本, 🇹🇼 中国台湾, 🇩🇪 德国]}
  - {name: ✨ Gemini, type: select, proxies: [🔗 住宅链路, 🔗 链式美国, 🇺🇸 美国, 🇸🇬 新加坡, 🇯🇵 日本, 🇹🇼 中国台湾, 🇩🇪 德国]}
  - {name: 🧠 Claude, type: select, proxies: [🔗 住宅链路, 🔗 链式美国, 🇺🇸 美国, 🇸🇬 新加坡, 🇯🇵 日本, 🇹🇼 中国台湾, 🇩🇪 德国]}
  - {name: 🌌 常用 AI, type: select, proxies: [🔗 住宅链路, 🔗 链式美国, 🇺🇸 美国, 🇸🇬 新加坡, 🇯🇵 日本, 🇹🇼 中国台湾, 🇩🇪 德国]}

  # --- 6. 社交与办公 ---
  - {name: 📲 Telegram, type: select, proxies: [⚡ 自动选择, 🇨🇳 港澳, 🇺🇸 美国, 🇸🇬 新加坡, 🇯🇵 日本, 🇹🇼 中国台湾, 🇩🇪 德国]}
