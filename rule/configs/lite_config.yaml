# 生成时间: 2026-01-06
# 模板类型: 轻量模板

# ==========================================================
# 节点信息
# ==========================================================
proxies:
  - {name: 直连, type: direct}

# ==========================================================
# 全局配置 
# ==========================================================
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
find-process-mode: 'off'
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
disable-keep-alive: false
profile:
  store-selected: true
  store-fake-ip: true


# ==========================================================
# 嗅探
# ==========================================================
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.v2ex.com"
  skip-domain:
    - "+.baidu.com"

# ==========================================================
# 入站  
# ==========================================================
tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# ==========================================================
# DNS模块
# ==========================================================
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "rule-set:private_domain,cn_domain"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "+.market.xiaomi.com"
  default-nameserver:
   - 223.5.5.5
   - 223.6.6.6
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  # namesever尽量用运营商提供的DNS
  nameserver:
    - 8.8.8.8
    - 1.1.1.1
 
# ==========================================================
# 锚点配置
# ==========================================================
rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  class: &class {type: http, interval: 86400, behavior: classical, format: text}

# ==========================================================
# 代理分组 (简化逻辑：核心服务分类)
# ==========================================================
proxy-groups:
  # 1. 核心分流组
  - {name: 🚀 默认代理, type: select, include-all: true, filter: "^((?!(直连)).)*$", proxies: [⚡ 自动选择, 🌐 全部节点]}
  - {name: 🤖 AI 服务, type: select, proxies: [🇺🇸 美国自动, 🇯🇵 日本自动, 🇸🇬 新加坡自动, 🇩🇪 德国自动]}
  - {name: 📲 社交办公, type: select, proxies: [🚀 默认代理, ⚡ 自动选择, 🇭🇰 香港自动]}
  - {name: 🎬 流媒体, type: select, proxies: [⚡ 自动选择, 🇭🇰 香港自动, 🇹🇼 台湾自动, 🇯🇵 日本自动, 🇺🇸 美国自动]}
  - {name: 🎮 游戏平台, type: select, proxies: [🎯 直连, 🚀 默认代理, ⚡ 自动选择, 🇭🇰 香港自动, 🇯🇵 日本自动]}
  - {name: 🇨🇳 大陆服务, type: select, proxies: [🎯 直连, 🚀 默认代理]}

  # 2. 基础策略
  - {name: 🚫 广告拦截, type: select, proxies: [REJECT, DIRECT]}
  - {name: 🎯 直连, type: select, proxies: [DIRECT, 🚀 默认代理]}
  - {name: 🐟 漏网之鱼, type: select, proxies: [🚀 默认代理, 🎯 直连]}

  # 3. 自动化底层 (通过正则筛选节点)
  - {name: ⚡ 自动选择, type: url-test, include-all: true, tolerance: 20, interval: 300}
  - {name: 🌐 全部节点, type: select, include-all: true}
  - {name: 🇭🇰 香港自动, type: url-test, include-all: true, filter: "(?i)香港|HK"}
  - {name: 🇯🇵 日本自动, type: url-test, include-all: true, filter: "(?i)日本|JP"}
  - {name: 🇺🇸 美国自动, type: url-test, include-all: true, filter: "(?i)美国|US"}
  - {name: 🇸🇬 新加坡自动, type: url-test, include-all: true, filter: "(?i)新加坡|SG"}
  - {name: 🇹🇼 台湾自动, type: url-test, include-all: true, filter: "(?i)台湾|TW"}
  - {name: 🇩🇪 德国自动, type: url-test, include-all: true, filter: "(?i)德国|DE"}

# ==========================================================
# 规则匹配 (精简路由)
# ==========================================================
rules:
  # 系统与广告
  - RULE-SET,category-ads-all,🚫 广告拦截
  - RULE-SET,private_domain,🎯 直连
  - GEOIP,LAN,🎯 直连

  # AI 分流 (OpenAI/Gemini/Claude 等)
  - RULE-SET,openai,🤖 AI 服务
  - RULE-SET,gemini,🤖 AI 服务
  - RULE-SET,claude,🤖 AI 服务
  - RULE-SET,ai,🤖 AI 服务

  # 社交与办公 (Telegram/GitHub/Discord 等)
  - RULE-SET,telegram_domain,📲 社交办公
  - RULE-SET,github_domain,📲 社交办公
  - RULE-SET,discord_domain,📲 社交办公
  - RULE-SET,microsoft_domain,📲 社交办公

  # 流媒体 (YouTube/Netflix/Disney/Spotify 等)
  - RULE-SET,youtube_domain,🎬 流媒体
  - RULE-SET,netflix_domain,🎬 流媒体
  - RULE-SET,disney_domain,🎬 流媒体
  - RULE-SET,spotify_domain,🎬 流媒体

  # 游戏平台 (Steam/Ubisoft/Epic/EA/Sony)
  - RULE-SET,steam_domain,🎮 游戏平台
  - RULE-SET,ubisoft_domain,🎮 游戏平台
  - RULE-SET,epic_domain,🎮 游戏平台
  - RULE-SET,ea_domain,🎮 游戏平台
  - RULE-SET,sony_domain,🎮 游戏平台

  # 国内服务与兜底
  - RULE-SET,cn_domain,🇨🇳 大陆服务
  - RULE-SET,cn_ip,🇨🇳 大陆服务,no-resolve
  - GEOIP,CN,🇨🇳 大陆服务,no-resolve
  - MATCH,🐟 漏网之鱼

 
