# 生成时间: 2026-02-04
# 模板类型: 轻量模板 - 精简的规则和策略，适合手机或低性能设备
# 作者: YZFN
# ==========================================================
# 全局基础配置
# ==========================================================
port: 7890
socks-port: 7891
mixed-port: 7893
allow-lan: true
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

dns:
  enable: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - 8.8.8.8
    - 1.1.1.1

# ==========================================================
# 锚点配置 (引用)
# ==========================================================
rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  class: &class {type: http, interval: 86400, behavior: classical, format: text}

# ==========================================================
# 出站策略 (精简后的分组)
# ==========================================================
proxy-groups:
  # 1. 主代理组
  - {name: 🚀 节点选择, type: select, proxies: [⚡ 自动选择, 🇭🇰 香港自动, 🇯🇵 日本自动, 🇸🇬 新加坡自动, 🇹🇼 台湾自动, 🇺🇸 美国自动, 🇩🇪 德国自动, 🌐 全部节点, 🎯 全球直连]}

  # 2. AI 服务 (对 IP 要求严苛)
  - {name: 🤖 人工智能, type: select, proxies: [🇺🇸 美国自动, 🇯🇵 日本自动, 🇸🇬 新加坡自动, 🇹🇼 台湾自动, 🇩🇪 德国自动, 🚀 节点选择]}

  # 3. 国际影视 (Youtube/Netflix/TikTok等)
  - {name: 🎬 国际影视, type: select, proxies: [⚡ 自动选择, 🇭🇰 香港自动, 🇯🇵 日本自动, 🇸🇬 新加坡自动, 🇺🇸 美国自动, 🚀 节点选择]}

  # 4. 社交/谷歌/GitHub (日常办公)
  - {name: 🌍 社交办公, type: select, proxies: [⚡ 自动选择, 🇭🇰 香港自动, 🇯🇵 日本自动, 🇸🇬 新加坡自动, 🚀 节点选择, 🎯 全球直连]}

  # 5. 大陆服务 (回国加速/直连)
  - {name: 🇨🇳 大陆服务, type: select, proxies: [🎯 全球直连, 🇨🇳 中国自动, 🇭🇰 香港自动, 🚀 节点选择]}

  - {name: 🚫 广告拦截, type: select, proxies: [REJECT, DIRECT]}
  - {name: 🎯 全球直连, type: select, proxies: [DIRECT, 🚀 节点选择]}

  # --- 底层自动筛选 (保留强力正则) ---
  - {name: ⚡ 自动选择, type: url-test, include-all: true, url: 'http://cp.cloudflare.com/generate_204', interval: 300, filter: "^((?!(回国|中国|China|CN|Mainland)).)*$"}
  
  - {name: 🇭🇰 香港自动, type: url-test, include-all: true, url: 'http://cp.cloudflare.com/generate_204', interval: 300, filter: "(?i)香港|HK|HongKong"}
  
  - {name: 🇯🇵 日本自动, type: url-test, include-all: true, url: 'http://cp.cloudflare.com/generate_204', interval: 300, filter: "(?i)日本|Japan|JP|东京|大阪|埼玉|京都|名古屋|福冈|札幌|横滨|仙台|千叶|神户|奈良|广岛|静冈|冲绳"}
  
  - {name: 🇺🇸 美国自动, type: url-test, include-all: true, url: 'http://cp.cloudflare.com/generate_204', interval: 300, filter: "(?i)美国|USA|US|洛杉矶|纽约|旧金山|西雅图|芝加哥"}
  
  - {name: 🇸🇬 新加坡自动, type: url-test, include-all: true, url: 'http://cp.cloudflare.com/generate_204', interval: 300, filter: "(?i)新加坡|Singapore|SG|狮城"}
  
  - {name: 🇹🇼 台湾自动, type: url-test, include-all: true, url: 'http://cp.cloudflare.com/generate_204', interval: 300, filter: "(?i)台湾|Taiwan|TW|台北|台中|新竹|彰化|高雄"}
  
  - {name: 🇩🇪 德国自动, type: url-test, include-all: true, url: 'http://cp.cloudflare.com/generate_204', interval: 300, filter: "(?i)德国|Germany|DE|法兰克福|柏林|慕尼黑"}
  
  - {name: 🇨🇳 中国自动, type: url-test, include-all: true, url: 'https://www.apple.com/library/test/success.html', interval: 300, filter: "(?i)中国|China|CN|回国|北京|上海|广州|深圳|杭州|成都|南京|武汉|天津|重庆|西安|苏州|江苏|浙江|广东|山东|福建|安徽|河南|湖北|湖南|江西|河北|山西|辽宁|吉林|黑龙江|海南|四川|贵州|云南|甘肃|青海|内蒙古|广西|西藏|宁夏|新疆"}

  - {name: 🌐 全部节点, type: select, include-all: true}

# ==========================================================
# 规则匹配 (Rules)
# ==========================================================
rules:
  - RULE-SET,category-ads-all,🚫 广告拦截
  
  # AI 服务
  - RULE-SET,ai_all,🤖 人工智能
  
  # 国际影视
  - RULE-SET,youtube_domain,🎬 国际影视
  - RULE-SET,netflix_domain,🎬 国际影视
  - RULE-SET,streaming_all,🎬 国际影视
  
  # 社交与办公
  - RULE-SET,telegram_domain,🌍 社交办公
  - RULE-SET,telegram_ip,🌍 社交办公,no-resolve
  - RULE-SET,social_all,🌍 社交办公
  - RULE-SET,google_domain,🌍 社交办公
  - RULE-SET,github_domain,🌍 社交办公
  
  # 大陆服务分流
  - RULE-SET,bilibili_domain,🇨🇳 大陆服务
  - RULE-SET,apple_domain,🇨🇳 大陆服务
  - RULE-SET,cn_domain,🇨🇳 大陆服务
  - RULE-SET,cn_ip,🇨🇳 大陆服务,no-resolve
  
  # 基础直连
  - RULE-SET,private_domain,🎯 全球直连
  - GEOIP,LAN,🎯 全球直连
  - GEOIP,CN,🎯 全球直连

  # 兜底流量
  - RULE-SET,gfw_domain,🚀 节点选择
  - MATCH,🚀 节点选择

