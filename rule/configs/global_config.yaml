# ==========================================================
# 更新时间: 2026-11-08
# 模板类型: 全球上网模板 (已修正核心报错与语法隐患)
# 策略说明: 全部策略组使用 include-all + exclude-filter 自动测速选路
# 作者: YZFN
# ==========================================================

# ==========================================================
# 节点信息
# ==========================================================
proxies:
  - {name: 直连, type: direct}

# ==========================================================
# 全局配置 
# ==========================================================
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
find-process-mode: 'off'
keep-alive-idle: 600
keep-alive-interval: 15
disable-keep-alive: false
profile:
  store-selected: true
  store-fake-ip: true

# ==========================================================
# 嗅探
# ==========================================================
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "dlg.io.mi.com"
    - "+.baidu.com"
    - "+.apple.com"

# ==========================================================
# 入站  
# ==========================================================
tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-detect-interface: true

# ==========================================================
# DNS模块
# ==========================================================
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  fake-ip-range: 198.18.0.1/16
  enhanced-mode: fake-ip
  fake-ip-filter:
    - "rule-set:private_domain"
    - "*.msftconnecttest.com"
    - "*.msftncsi.com"
    - "time.*.com"
  
  # 默认 DNS，用于解析 DNS Over HTTPS 的域名
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  
  # 代理节点域名解析
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
  
  # 国内解析：使用国内高可靠 DNS
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  
  # 分流解析
  nameserver-policy:
    "geosite:private": [https://dns.alidns.com/dns-query, https://doh.pub/dns-query]
    "geosite:cn": [https://dns.alidns.com/dns-query, https://doh.pub/dns-query]
    "geosite:geolocation-!cn": [https://8dru8z0see.cloudflare-gateway.com/dns-query, https://upw7thu31v.cloudflare-gateway.com/dns-query]

# ==========================================================
# 锚点配置
# ==========================================================
rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  class: &class {type: http, interval: 86400, behavior: classical, format: text}

# ==========================================================
# 出站策略组 (Proxy Groups)
