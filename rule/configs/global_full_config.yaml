  - {name: 🧱 漏网之鱼, type: select, proxies: [🚀 默认代理, DIRECT, ⚡ 自动选择]} # 未匹配到的冷门流量兜底

# ==========================================================
# 规则匹配 (Rules) 
# ==========================================================
# 规则匹配采用自上而下的顺序，一旦匹配成功即停止向下匹配。
# 因此，高优先级的（如防BT、局域网直连、去广告）必须放在最前面。
rules:
  # --- ⚠️ 核心保护：防止 BT 下载导致节点被封 ---
  # 强烈建议保留：防止 P2P 下载软件的流量走代理，导致机场节点因版权投诉（DMCA）被封禁
  - MATCH,PROCESS-NAME,BitTorrent,DIRECT    # 匹配 BitTorrent 进程直连
  - MATCH,PROCESS-NAME,qBittorrent,DIRECT   # 匹配 qBittorrent 进程直连
  - MATCH,PROCESS-NAME,Transmission,DIRECT  # 匹配 Transmission 进程直连
  - MATCH,PROCESS-NAME,uTorrent,DIRECT      # 匹配 uTorrent 进程直连
  - MATCH,PROCESS-NAME,aria2c,DIRECT        # 匹配 aria2c 下载神器进程直连

  # --- 基础去广告与直连 ---
  - RULE-SET,category-ads-all,🚫 广告拦截   # 拦截各大平台和网盟的广告、追踪器流量
  - RULE-SET,private_domain,DIRECT          # 局域网及私有域名直连（如路由器后台、NAS域名等）
  - RULE-SET,custom_direct,DIRECT           # 用户自定义的强制直连域名规则库

  # 局域网 IP 段强制直连。附加 `no-resolve` 表示匹配时不需要先去解析 DNS，提升响应速度并防止 DNS 泄露
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve # 常见家用路由器局域网网段
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve     # 企业级/大型局域网网段
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve  # Docker/虚拟机等常用网段

  # --- 基础分流 ---
  - RULE-SET,proxylite,🚀 默认代理          # 自定义必须走代理的轻量域名列表
  - RULE-SET,cn_domain,DIRECT               # 确认为中国大陆的域名，强制直连，降低代理节点压力
  - RULE-SET,se_asia,🌏️ 东南亚              # 专门针对东南亚服务（如 Shopee, Grab 等）走东南亚节点组

  # --- AI 规则 ---
  # AI 服务通常对 IP 要求极高，建议统一指向专属的 AI 节点组，避免频繁弹验证码或被封号
  - RULE-SET,openai,🌌 AI                   # ChatGPT / OpenAI 官方服务
  - RULE-SET,gemini,🔍 Google               # Google Gemini (因同属 Google，也可分配到 Google 组)
  - RULE-SET,claude,🌌 AI                   # Anthropic Claude 系列
  - RULE-SET,perplexity_domain,🌌 AI        # Perplexity AI 搜索引擎
  - RULE-SET,huggingface_domain,🌌 AI       # HuggingFace 开源 AI 社区
  - RULE-SET,ai,🌌 AI                       # 其他非中国大陆的泛 AI 平台及工具

  # --- 社交与通讯 ---
  # Telegram 拥有自建的强 IP 段，需搭配 IP 和 Domain 规则同时使用
  - RULE-SET,telegram_ip,📲 Telegram,no-resolve # Telegram 官方 IP 段 (不解析 DNS 直接匹配)
  - RULE-SET,telegram_domain,📲 Telegram        # Telegram 域名
  - RULE-SET,discord_domain,📱 社交媒体         # Discord 语音与社区
  - RULE-SET,reddit_domain,📱 社交媒体          # Reddit 论坛
  - RULE-SET,whatsapp_domain,📱 社交媒体        # WhatsApp 通讯
  - RULE-SET,line_domain,📱 社交媒体            # Line 通讯 (日韩台常用)
  - RULE-SET,pinterest_domain,📱 社交媒体       # Pinterest 灵感图片社区
  - RULE-SET,facebook_domain,🌏 Meta            # Facebook 主站及周边服务
  - RULE-SET,instagram_domain,🌏 Meta           # Instagram 图片社交
  - RULE-SET,twitter_domain,🐦 X                # Twitter / X

  # --- 加密货币 Web3 ---
  # 交易所等金融类服务对 IP 变动较敏感，通常建议走固定节点或专有的支付/直连策略
  - RULE-SET,binance_domain,💳 海外支付         # 币安 Binance 交易所
  - RULE-SET,okx_domain,💳 海外支付             # 欧易 OKX 交易所

  # --- 生产力与协作 ---
  - RULE-SET,linkedin_domain,💼 办公            # 领英 LinkedIn
  - RULE-SET,notion_domain,💼 办公              # Notion 笔记
  - RULE-SET,figma_domain,💼 办公               # Figma 在线设计
  - RULE-SET,zoom_domain,💼 办公                # Zoom 视频会议

  # --- 开发者与云服务 ---
  - RULE-SET,github_domain,🧑‍💻 开发            # GitHub 代码托管 (走代理加速 Clone 和网页加载)
  - RULE-SET,cloudflare_domain,☁️ 云服务        # Cloudflare 平台及各类服务
  - RULE-SET,docker_domain,🧑‍💻 开发            # Docker Hub 镜像拉取加速
  - RULE-SET,vercel_domain,🧑‍💻 开发            # Vercel 静态托管平台
  - RULE-SET,aws_domain,☁️ 云服务               # AWS 亚马逊云服务控制台及 API
  - RULE-SET,dropbox_domain,☁️ 云服务           # Dropbox 云盘

  # --- 视频流媒体 ---
  - RULE-SET,youtube_domain,📺 流媒体           # YouTube 视频服务
  - RULE-SET,netflix_ip,📺 流媒体,no-resolve    # Netflix 官方 IP 段
  - RULE-SET,netflix_domain,📺 流媒体           # Netflix 域名
  - RULE-SET,disney_domain,📺 流媒体            # Disney+ 流媒体
  - RULE-SET,tiktok_domain,📺 流媒体（解锁）    # TikTok 抖音国际版 (需特殊解锁节点支持)
  - RULE-SET,primevideo_domain,📺 流媒体        # 亚马逊 Prime Video
  - RULE-SET,hbo_domain,📺 流媒体               # HBO Max 流媒体
  - RULE-SET,hulu_domain,📺 流媒体              # Hulu 流媒体
  - RULE-SET,crunchyroll_domain,📺 流媒体       # Crunchyroll 动漫流媒体
  - RULE-SET,peacock_domain,📺 流媒体           # Peacock 视频
  - RULE-SET,paramount_domain,📺 流媒体         # Paramount+ 派拉蒙
  - RULE-SET,discovery_domain,📺 流媒体         # Discovery+ 探索频道
  - RULE-SET,espn_domain,📺 流媒体              # ESPN 体育频道
