  - {name: 📺 流媒体（解锁）, type: url-test, url: "http://cp.cloudflare.com/generate_204", include-all: true, tolerance: 20, interval: 300, exclude-filter: "(?i)直连|上海|北京|广州|深圳|杭州|徐州|江苏|浙江|南京|中国|国内|回国|China|Mainland|CN|SHA|PEK|CAN|SZX|HGH|香港|hk|HK"} # 特意排除香港节点（如 TikTok 等限制香港）
