# 更新时间: 2026-06-03
# 模板类型: 全球上网全量模板 - 针对全球上网需求优化，适用于国际访问
# 作者: YZFN
# ==========================================================
# 节点信息
# ==========================================================
proxies:
  - {name: 直连, type: direct} # 定义一个名为“直连”的本地直连策略，供后续引用

# ==========================================================
# 全局基础配置 
# ==========================================================
port: 7890                  # HTTP 代理端口
socks-port: 7891            # SOCKS5 代理端口
redir-port: 7892            # Redir 端口 (主要用于 Linux 透明代理)
mixed-port: 7893            # HTTP/SOCKS 混合代理端口 (推荐日常软件直接填这个)
tproxy-port: 7894           # TProxy 端口 (更高级的透明代理)
allow-lan: true             # 允许局域网内的其他设备连接此代理
bind-address: "*"           # 监听所有 IP 地址 (配合 allow-lan 使用)
ipv6: true                  # 开启 IPv6 支持
unified-delay: true         # 统一延迟：消除握手等干扰，让节点的延迟测试更接近真实体感
tcp-concurrent: true        # TCP 并发连接：加速网页加载
log-level: warning          # 日志级别：warning 可以减少无用日志，只输出警告和错误
find-process-mode: 'off'    # 进程名匹配模式：开启 Tun 后建议依赖 Tun 自动获取，设为 off 即可
global-client-fingerprint: chrome # 伪装客户端 TLS 指纹为 Chrome，防止被某些网站封杀/阻断
keep-alive-idle: 600        # TCP Keep Alive 空闲时间 (秒)
keep-alive-interval: 15     # TCP Keep Alive 间隔时间 (秒)
disable-keep-alive: false   # 是否禁用 Keep Alive (保持 false 即可)
profile:
  store-selected: true      # 记忆你的节点选择，重启软件后不丢失
  store-fake-ip: true       # 持久化 fake-ip 记录，防止重启后 DNS 解析混乱

# ==========================================================
# 嗅探配置 (Sniffer)
# ==========================================================
# 嗅探的作用：从网络流量中提取真实的域名。在使用透明代理（Tun）时，
# 很多流量只带有 IP，嗅探可以找回域名，从而让后续的域名分流规则生效。
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true # 强烈建议 true：用嗅探到的真实域名覆盖目标 IP
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  # 嗅探白名单：以下域名不进行嗅探，防止出现 Apple 等服务异常或设备断连
  skip-domain:
    - "Mijia Cloud"
    - "dlg.io.mi.com"
    - "*.baidu.com"   # [已修复] 标准通配符为 *
    - "*.apple.com"   # [已修复] 苹果服务建议直连且跳过嗅探以防异常

# ==========================================================
# 入站 (Tun 模式) - 虚拟网卡
# ==========================================================
tun:
  enable: true                # 开启 Tun 模式 (真正的全局接管所有软件流量)
  stack: mixed                # 网络栈：mixed 结合了 gVisor 和 System 的优点
  dns-hijack: ["any:53", "tcp://any:53"] # 劫持本机的所有 53 端口 DNS 请求并交给内核处理
  auto-route: true            # 自动设置系统路由表，将流量导入 Tun 网卡
  auto-detect-interface: true # 自动检测出口网卡 (如 Wi-Fi 或以太网)

# ==========================================================
# DNS 模块 (防止 DNS 污染与解析泄露)
# ==========================================================
dns:
  enable: true
  listen: 0.0.0.0:1053        # DNS 监听端口
  ipv6: false                 # 暂不解析 IPv6 的 DNS，防止某些网络下出现连接问题
  respect-rules: true         # DNS 请求是否遵守 rules (路由规则) 进行分流
  fake-ip-range: 198.18.0.1/16 # [已修复] Fake-IP 的网段，改为了标准且安全的 RFC 保留段
  enhanced-mode: fake-ip      # 使用 Fake-IP 模式 (极大提升网页首次打开速度)
  
  # Fake-IP 过滤：列表中的域名将返回真实的 IP，而不是 Fake-IP
  fake-ip-filter:
    - "rule-set:private_domain" # [已修复] 拆分为独立的 rule-set，局域网必须返回真实 IP
    - "rule-set:cn_domain"      # [已修复] 国内域名返回真实 IP，便于国内直连加速
    - "*.msftconnecttest.com"   # [已修复] 微软网络探测
    - "*.msftncsi.com"          # [已修复] 微软网络探测
    - "time.*.com"              # NTP 时间同步服务器

  # 默认 DNS：仅用于解析下方 DoH (https://...) 链接本身的域名
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  
  # 代理节点域名解析：用于解析你机场节点地址的 DNS
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
  
  # 全局默认 DNS：解析未命中的普通域名
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  
  # 🎯 分流解析：根据域名规则请求不同的 DNS，彻底解决国内外 DNS 污染
  nameserver-policy:
    "geosite:cn": [https://dns.alidns.com/dns-query, https://doh.pub/dns-query] # [已修复] 拆分键名
    "geosite:private": [https://dns.alidns.com/dns-query, https://doh.pub/dns-query]
    "geosite:geolocation-!cn": [https://8dru8z0see.cloudflare-gateway.com/dns-query, https://upw7thu31v.cloudflare-gateway.com/dns-query] # 纯国外 DNS
 
# ==========================================================
# 锚点配置 (复用代码)
# ==========================================================
rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  class: &class {type: http, interval: 86400, behavior: classical, format: text}

# ==========================================================
# 出站策略组 (Proxy Groups) 
