# 更新时间: 2026-10-23
# 模板类型: 全球上网全量模板
# 作者: YZFN (已根据 IP直连/QUIC优化深度调优)
# 适用场景:
#   1. 适用于需要稳定访问全球站点、AI 服务、社交媒体和流媒体的环境。
#   2. 重点兼顾 TikTok、YouTube、Netflix、Spotify、Telegram 等高频海外应用。
#   3. 通过分流、DNS Fake-IP 和 TUN 模式降低首包延迟和连接异常。
#   4. 以“代理优先、国内/局域网直连、海外按业务分组”为设计原则。
# ==========================================================
# 节点信息
# ==========================================================
# 配置模板不内置任何机场节点；将订阅或自建节点导入客户端后，策略组会通过 include-all 自动纳入。
proxies:
  - {name: 直连, type: direct} # 仅保留本地直连节点，避免模板中出现无效代理对象

# ==========================================================
# 全局基础配置
# ==========================================================
# 说明：本段配置决定 Clash / Meta 的核心行为，包括监听端口、LAN 访问、TCP/UDP 处理和连接保活。
port: 7890                  # HTTP 代理端口，常用于浏览器/桌面端代理连接
socks-port: 7891            # SOCKS5 代理端口，适配游戏、终端、部分客户端
redir-port: 7892            # Redir 端口，主要用于 Linux 下透明代理/系统级流量转发
mixed-port: 7893            # 兼容 HTTP + SOCKS 的混合代理端口，便于多客户端接入
tproxy-port: 7894           # TProxy 端口，常配合 Linux 的 TProxy 模式实现透明路由
allow-lan: true             # 允许局域网设备连接代理，适合路由器、树莓派、NAS 等场景
bind-address: "*"           # 监听所有网卡地址，确保局域网/宿主机能正常访问
ipv6: false                 # 关闭 IPv6，避免 IPv6 直连/泄漏导致规则失效或访问异常
unified-delay: true         # 统一延迟模式，可减少握手过程中的不稳定波动，更接近真实延迟表现
tcp-concurrent: true        # 开启 TCP 并发连接，提升首屏打开速度和大文件下载体验
log-level: warning          # 日志级别建议使用 warning，兼顾可读性与运行稳定性
find-process-mode: 'off'    # Tun 模式下建议关闭进程查找，减少额外 CPU 开销
global-client-fingerprint: chrome # 伪装客户端 TLS 指纹为 Chrome，降低被识别为非浏览器流量的概率
keep-alive-idle: 600        # TCP 空闲连接保持时间，单位秒，控制长连接保持策略
keep-alive-interval: 15     # TCP Keep Alive 检测间隔，单位秒，帮助网络抖动环境更稳定
disable-keep-alive: false   # 保持长连接功能开启，避免高延迟模式下连接频繁断开
profile:
  store-selected: true      # 记住当前选择的节点，重启后不丢失上次状态
  store-fake-ip: true       # 持久化 Fake-IP 记录，避免重启后 DNS 与真实 IP 映射混乱

# ==========================================================
# 嗅探配置 (Sniffer)
# ==========================================================
# Sniffer 用于识别 HTTP/TLS/QUIC 流量并根据真实 SNI / Host 提取目标信息。
# 对于 TikTok、流媒体和部分高阶应用，有时仅看 IP 很难正确匹配域名，因此开启嗅探非常关键。
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true # 用嗅探到的真实域名覆盖目标 IP，减少误判和污染
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "dlg.io.mi.com"

# ==========================================================
# 入站 (Tun 模式)
# ==========================================================
# Tun 模式通过虚拟网卡接管系统流量，适合需要全面代理的设备场景。
# stack: mixed 在兼顾体验和稳定性的同时，通常可获得更好的兼容性和防止部分应用不走代理的问题。
tun:
  enable: true                # 开启 Tun 虚拟网卡模式，适合全局代理
  stack: mixed                # mixed 结合 gVisor 与 System 的优点，兼顾性能和兼容性
  dns-hijack: ["any:53", "tcp://any:53"] # 劫持本机 53 端口 DNS，确保 DNS 查询强制走代理或本地解析策略
  auto-route: true            # 自动设置系统路由，减少手动配置造成的漏网流量
  auto-detect-interface: true # 自动识别当前默认网卡，适应 Wi-Fi / 有线网切换

# ==========================================================
# DNS 模块
# ==========================================================
# DNS 是这份模板性能与稳定性的关键部分。
# 1) enhanced-mode: fake-ip 能避开部分应用对真实 IP 和 DNS 的绑定问题。
# 2) 默认解析走国内公共 DNS，可加快解析速度并减少链路抖动。
# 3) 代理服务解析优先使用稳定的公共 DNS，降低 DoH/DoT 握手带来的首包延迟。
dns:
  enable: true
  listen: 0.0.0.0:1053       # 监听地址；0.0.0.0 表示允许本机和局域网主机访问
  ipv6: false
  respect-rules: false         # DNS 请求不强制完全遵守所有 rules，提升兼容性与解析成功率
  fake-ip-range: 198.18.0.1/16 # 使用 RFC 保留地址段作为 Fake-IP 范围，避免与真实局域网冲突
  enhanced-mode: fake-ip       # Fake-IP 模式，适合大多数需要绕过本地 DNS 绑定的应用

  # Fake-IP 过滤：允许真实 IP / 关键系统服务继续使用真实解析，避免出现“无网络但有 DNS 解析”的异常
  fake-ip-filter:
    # 命中这些条目的查询不分配 Fake-IP，交由 DNS 上游返回真实地址。
    - "rule-set:private_domain"
    - "*.msftconnecttest.com"
    - "*.msftncsi.com"
    - "time.*.com"
    - "ntp.*.com"

  # 引导 DNS：用于解析后续 DNS 服务器的主机名，建议填写可直接访问的 IP。
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 代理节点地址解析：用于解析节点服务器域名，避免节点尚未连通时形成 DNS 依赖环。
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 常规 DNS 上游；这里使用 Cloudflare Gateway 的 DoH 服务。
  nameserver:
    - https://8dru8z0see.cloudflare-gateway.com/dns-query
    - https://upw7thu31v.cloudflare-gateway.com/dns-query

# ==========================================================
# 锚点配置 (复用代码)
# ==========================================================
# 这部分定义规则集的共用模板：interval 为更新间隔（秒），behavior 指定数据类型，format 指定文件格式。
# 后续 rule-providers 通过 YAML 合并键 << 复用这些字段，避免每个规则源重复书写。
rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  class: &class {type: http, interval: 86400, behavior: classical, format: text}

# ==========================================================
# 出站策略组 (Proxy Groups)
# ==========================================================
# 策略组的设计目标：
#   1. 让常见业务按类型走不同节点，降低单节点过载。
#   2. 定义默认代理、AI、社交、开发、流媒体等不同赛道。
#   3. 使用 url-test 对节点做探测，以自动选择低延迟且稳定的节点。
#   4. 通过 exclude-filter 过滤掉国内节点与明显不合适的地区节点。
# 下方 url-test 组共享参数说明：include-all 纳入所有代理节点；url 是延迟探测地址；
# interval 是探测间隔（秒）；tolerance 是切换容差（毫秒）；filter 按名称筛选，exclude-filter 按名称排除。
# select 组不自动测速，用户可在客户端手动选择其 proxies 列表中的策略或节点。
proxy-groups:
  # 🚀 默认代理：全局总开关，优先走海外稳定节点，过滤掉国内和高延迟节点
  - {name: 🚀 默认代理, type: url-test, url: "https://www.google.com/generate_204", include-all: true, tolerance: 50, interval: 120, exclude-filter: "(?i)直连|上海|北京|广州|深圳|杭州|徐州|江苏|浙江|南京|中国|国内|回国|China|Mainland|CN|SHA|PEK|CAN|SZX|HGH"}

  # ⚡ 自动选择：保留全局代理入口，适合未作细分的通用流量
  - {name: ⚡ 自动选择, type: url-test, url: "https://www.google.com/generate_204", include-all: true, tolerance: 50, interval: 120, exclude-filter: "(?i)直连|上海|北京|广州|深圳|杭州|徐州|江苏|浙江|南京|中国|国内|回国|China|Mainland|CN|SHA|PEK|CAN|SZX|HGH"}

  # 🌌 AI：针对 OpenAI / Claude / Gemini 等 AI 服务，优先稳定和低延迟节点
  - {name: 🌌 AI, type: url-test, url: "https://www.google.com/generate_204", include-all: true, tolerance: 50, interval: 120, exclude-filter: "(?i)直连|上海|北京|广州|深圳|杭州|徐州|江苏|浙江|南京|中国|国内|回国|China|Mainland|CN|SHA|PEK|CAN|SZX|HGH|香港|澳门|澳門|HK|hk|MO"}

  # 社交媒体相关：Telegram、Instagram、Facebook、Twitter 等高频社交应用
  - {name: 📲 Telegram, type: url-test, url: "https://www.google.com/generate_204", include-all: true, tolerance: 50, interval: 120, exclude-filter: "(?i)直连|上海|北京|广州|深圳|杭州|徐州|江苏|浙江|南京|中国|国内|回国|China|Mainland|CN|SHA|PEK|CAN|SZX|HGH"}
  - {name: 🌏 Meta, type: url-test, url: "https://www.google.com/generate_204", include-all: true, tolerance: 50, interval: 120, exclude-filter: "(?i)直连|上海|北京|广州|深圳|杭州|徐州|江苏|浙江|南京|中国|国内|回国|China|Mainland|CN|SHA|PEK|CAN|SZX|HGH"}
  - {name: 🐦 X, type: url-test, url: "https://www.google.com/generate_204", include-all: true, tolerance: 50, interval: 120, exclude-filter: "(?i)直连|上海|北京|广州|深圳|杭州|徐州|江苏|浙江|南京|中国|国内|回国|China|Mainland|CN|SHA|PEK|CAN|SZX|HGH"}
  - {name: 📱 社交媒体, type: url-test, url: "https://www.google.com/generate_204", include-all: true, tolerance: 50, interval: 120, exclude-filter: "(?i)直连|上海|北京|广州|深圳|杭州|徐州|江苏|浙江|南京|中国|国内|回国|China|Mainland|CN|SHA|PEK|CAN|SZX|HGH"}

  # 生产力与开发：GitHub、Notion、Figma、LinkedIn 等办公/协作工具
  - {name: 💼 办公, type: url-test, url: "https://www.google.com/generate_204", include-all: true, tolerance: 50, interval: 120, exclude-filter: "(?i)直连|上海|北京|广州|深圳|杭州|徐州|江苏|浙江|南京|中国|国内|回国|China|Mainland|CN|SHA|PEK|CAN|SZX|HGH"}
  - {name: 🧑‍💻 开发, type: url-test, url: "https://www.google.com/generate_204", include-all: true, tolerance: 50, interval: 120, exclude-filter: "(?i)直连|上海|北京|广州|深圳|杭州|徐州|江苏|浙江|南京|中国|国内|回国|China|Mainland|CN|SHA|PEK|CAN|SZX|HGH"}
  - {name: ☁️ 云服务, type: url-test, url: "https://www.google.com/generate_204", include-all: true, tolerance: 50, interval: 120, exclude-filter: "(?i)直连|上海|北京|广州|深圳|杭州|徐州|江苏|浙江|南京|中国|国内|回国|China|Mainland|CN|SHA|PEK|CAN|SZX|HGH"}

  # 影音娱乐相关：YouTube、Netflix、Spotify 等应用的分流入口
  # 流媒体组仅排除大陆节点，保留香港和澳门节点供流媒体业务选择。
  - {name: 📺 流媒体, type: url-test, url: "https://www.google.com/generate_204", include-all: true, tolerance: 50, interval: 120, exclude-filter: "(?i)直连|上海|北京|广州|深圳|杭州|徐州|江苏|浙江|南京|中国|国内|回国|China|Mainland|CN|SHA|PEK|CAN|SZX|HGH"}
  # TikTok 独立选路：排除大陆及港澳节点，避免 TikTok 流量使用这些地区的出口。
  - {name: 🎵 TikTok, type: url-test, url: "https://www.google.com/generate_204", include-all: true, tolerance: 50, interval: 120, exclude-filter: "(?i)直连|上海|北京|广州|深圳|杭州|徐州|江苏|浙江|南京|中国|国内|回国|China|Mainland|CN|SHA|PEK|CAN|SZX|HGH|香港|澳门|澳門|HK|MO"}
  - {name: 🎧 音乐, type: url-test, url: "https://www.google.com/generate_204", include-all: true, tolerance: 50, interval: 120, exclude-filter: "(?i)直连|上海|北京|广州|深圳|杭州|徐州|江苏|浙江|南京|中国|国内|回国|China|Mainland|CN|SHA|PEK|CAN|SZX|HGH"}
  - {name: 🎮 游戏, type: url-test, url: "https://www.google.com/generate_204", include-all: true, tolerance: 50, interval: 120, exclude-filter: "(?i)直连|上海|北京|广州|深圳|杭州|徐州|江苏|浙江|南京|中国|国内|回国|China|Mainland|CN|SHA|PEK|CAN|SZX|HGH"}

  # 区域特色：按照地区筛选节点，适合东南亚、Google 专用等场景
  # 🌏️ 东南亚：自动筛选区域节点，并额外引用「🚀 默认代理」组作为兜底（区域内无可用节点时仍可出网）
  - {name: 🌏️ 东南亚, type: url-test, url: "https://www.google.com/generate_204", include-all: true, tolerance: 50, interval: 120, filter: "(?i)新加坡|狮城|马来西亚|吉隆坡|马六甲|槟城|印尼|雅加达|巴厘岛|菲律宾|马尼拉|越南|胡志明市|河内|泰国|曼谷|清迈|孟买", proxies: [🚀 默认代理]}
  - {name: 🔍 Google, type: url-test, url: "https://www.google.com/generate_204", include-all: true, tolerance: 50, interval: 120, exclude-filter: "(?i)直连|上海|北京|广州|深圳|杭州|徐州|江苏|浙江|南京|中国|国内|回国|China|Mainland|CN|SHA|PEK|CAN|SZX|HGH|香港|HK|hk"}

  # 自定义选择：手动指定某些服务优先走某个节点池，也可以作为兜底策略
  - {name: 🪟 微软, type: url-test, url: "https://www.google.com/generate_204", include-all: true, tolerance: 50, interval: 120, filter: "(?i)日本|东京|大阪|韩国|首尔|釜山|新加坡|狮城|澳洲|悉尼|墨尔本|印度|孟买|荷兰|阿姆斯特丹|爱尔兰|都柏林|法国|巴黎|德国|法兰克福|英国|伦敦|瑞典|瑞士|挪威|美国|美西|美东|洛杉矶|加拿大|多伦多|巴西|圣保罗|阿联酋|迪拜|南非|波兰", exclude-filter: "(?i)直连|上海|北京|广州|深圳|杭州|徐州|江苏|浙江|南京|中国|国内|回国|China|Mainland|CN|SHA|PEK|CAN|SZX|HGH|香港|HK|hk|澳门|MO"}
  - {name: 💳 海外支付, type: select, proxies: [⚡ 自动选择, 🚀 默认代理, DIRECT]}
  - {name: 🚫 广告拦截, type: select, proxies: [REJECT, DIRECT]}
  - {name: 🧱 漏网之鱼, type: select, proxies: [🚀 默认代理, ⚡ 自动选择, DIRECT]}

# ==========================================================
# 规则匹配 (Rules)
# ==========================================================
# 规则从上到下依次匹配，越靠前的规则优先级越高。
# 这里的设计重点包括：
#   1. 先阻断明显导致连接问题的 UDP 443 流量，减少丢包和 SNI 识别错误。
#   2. 对广告和本地私有网络优先直连，减少去代理的无效请求。
#   3. 对 AI、社交、开发、流媒体等业务应用分类分流，提高可用性。
#   4. 对部分境外支付、Google 和国内域名做单独兜底，保证稳定性和兼容性。
# RULE-SET 匹配远程规则集；IP-CIDR 匹配目标 IPv4 网段；IP-ASN 按目标 IP 的自治系统号匹配。
# no-resolve 表示规则判断时不为域名触发 DNS 解析；AND 用于组合多个条件；REJECT 丢弃匹配流量。
rules:
  # [重点优化] 强制阻断 UDP 443 端口，迫使客户端回退到 TCP 协议
  # 解决三大运营商 UDP QoS 严重丢包问题，并确保 TikTok/浏览器使用 TLS 握手正常嗅探 SNI
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT

  # --- 基础去广告与直连 ---
  # 尽量让广告、局域网、私有域名等流量尽快直连，降低代理资源占用和首包延迟。
  # 广告规则交给广告策略组处理；私有域名和自定义直连列表直接访问。
  - RULE-SET,category-ads-all,🚫 广告拦截
  - RULE-SET,private_domain,DIRECT
  - RULE-SET,custom_direct,DIRECT

  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve

  # --- 基础分流 ---
  # 通用代理列表与韩国规则进入默认代理组，东南亚规则进入地区专用自动测速组（该组额外引用默认代理组作兜底）。
  - RULE-SET,proxylite,🚀 默认代理
  - RULE-SET,se_asia,🌏️ 东南亚
  - RULE-SET,korea,🚀 默认代理

  # --- AI 规则 ---
  # AI 类应用通常对延迟和稳定性要求更高，因此被单独拆分成独立策略组。
  - RULE-SET,openai,🌌 AI
  - RULE-SET,gemini,🔍 Google
  - RULE-SET,claude,🌌 AI
  - RULE-SET,perplexity_domain,🌌 AI
  - RULE-SET,huggingface_domain,🌌 AI
  - RULE-SET,ai,🌌 AI

  # --- 社交与通讯 ---
  # Telegram 同时匹配 IP 与域名规则；其余服务按域名规则分别归入对应策略组。
  - RULE-SET,telegram_ip,📲 Telegram,no-resolve
  - RULE-SET,telegram_domain,📲 Telegram
  - RULE-SET,discord_domain,📱 社交媒体
  - RULE-SET,reddit_domain,📱 社交媒体
  - RULE-SET,whatsapp_domain,📱 社交媒体
  - RULE-SET,line_domain,📱 社交媒体
  - RULE-SET,pinterest_domain,📱 社交媒体
  - RULE-SET,facebook_domain,🌏 Meta
  - RULE-SET,instagram_domain,🌏 Meta
  - RULE-SET,twitter_domain,🐦 X

  # --- 加密货币 Web3 ---
  # 交易平台单独归入海外支付策略，方便按支付或账户所在地区调整出口。
  - RULE-SET,binance_domain,💳 海外支付
  - RULE-SET,okx_domain,💳 海外支付

  # --- 生产力与协作 ---
