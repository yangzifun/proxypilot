# url-test: 自动测速并选择延迟最低的节点。
# select: 允许用户手动在面板中选择节点。
# [已修复] 全面修复正则表达式崩溃问题：统一将复杂的 (?!) 负向预查替换为内核专用的 exclude-filter
# [已修复] 为所有的 url-test 类型补充了必须的 url 测速地址
proxy-groups:
  
  # 🚀 默认代理：总开关，排除了所有国内、直连等节点，只选择海外节点
  - {name: 🚀 默认代理, type: url-test, url: "http://cp.cloudflare.com/generate_204", include-all: true, tolerance: 20, interval: 300, exclude-filter: "(?i)直连|上海|北京|广州|深圳|杭州|徐州|江苏|浙江|南京|中国|国内|回国|China|Mainland|CN|SHA|PEK|CAN|SZX|HGH"}
  
  # ⚡ 自动选择：与默认代理逻辑相同，通常用于辅助策略
  - {name: ⚡ 自动选择, type: url-test, url: "http://cp.cloudflare.com/generate_204", include-all: true, tolerance: 20, interval: 300, exclude-filter: "(?i)直连|上海|北京|广州|深圳|杭州|徐州|江苏|浙江|南京|中国|国内|回国|China|Mainland|CN|SHA|PEK|CAN|SZX|HGH"}
  
  # 🌌 AI：排除了香港/澳门节点（因 OpenAI 等不提供服务），确保 AI 服务可用
