# 更新时间: 2026-06-03
# 模板类型: 全球上网全量模板 - 针对全球上网需求优化，适用于国际访问
# 作者: YZFN
# ==========================================================
# 节点信息
# ==========================================================
proxies:
  - {name: 直连, type: direct}
# ==========================================================
# 全局配置 
# ==========================================================
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
bind-address: "*"
ipv6: true
unified-delay: true
tcp-concurrent: true
log-level: warning
find-process-mode: 'off'
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
disable-keep-alive: false
profile:
  store-selected: true
  store-fake-ip: true


# ==========================================================
# 嗅探
# ==========================================================
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "dlg.io.mi.com"
    - "+.baidu.com"
    - "+.apple.com" # 苹果服务建议直连且跳过嗅探以防异常

# ==========================================================
# 入站  
# ==========================================================
tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# ==========================================================
# DNS模块
# ==========================================================
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  fake-ip-range: 28.0.0.1/8
  enhanced-mode: fake-ip
  fake-ip-filter:
    - "rule-set:private_domain,cn_domain" # 确保国内域名不返回 Fake-IP
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
  
  # 默认 DNS，用于解析 DNS Over HTTPS 的域名
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  
  # 代理节点域名解析
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
  
  # 国内解析：使用国内高可靠 DNS
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  
  # 分流解析：国内域名强制走国内 DNS，国外走国外 DNS
  nameserver-policy:
    "geosite:cn,private": [https://dns.alidns.com/dns-query, https://doh.pub/dns-query]
    "geosite:geolocation-!cn": [https://8dru8z0see.cloudflare-gateway.com/dns-query, https://upw7thu31v.cloudflare-gateway.com/dns-query]
 
# ==========================================================
# 锚点配置
# ==========================================================
rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  class: &class {type: http, interval: 86400, behavior: classical, format: text}

# ==========================================================
# 出站策略 (Proxy Groups) 
# ==========================================================
proxy-groups:

  # --- 默认代理 (总开关) ---
  - {name: 🚀 默认代理, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "^((?!(直连|上海|北京|广州|深圳|杭州|徐州|江苏|浙江|南京|中国|国内|回国|China|Mainland|CN|SHA|PEK|CAN|SZX|HGH)).)*$"}
  - {name: ⚡ 自动选择, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "^((?!(直连|上海|北京|广州|深圳|杭州|徐州|江苏|浙江|南京|中国|国内|回国|China|Mainland|CN|SHA|PEK|CAN|SZX|HGH)).)*$"}
 
  # --- AI 服务 ---
   - {name: 🌌 AI, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "^((?!(直连|上海|北京|广州|深圳|杭州|徐州|江苏|浙江|南京|中国|国内|回国|China|Mainland|CN|SHA|PEK|CAN|SZX|HGH|香港|澳门|澳門|HK|hk|MO)).)*$"}
  
  # --- 社交与通讯 ---
  - {name: 📲 Telegram, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "^((?!(直连|上海|北京|广州|深圳|杭州|徐州|江苏|浙江|南京|中国|国内|回国|China|Mainland|CN|SHA|PEK|CAN|SZX|HGH)).)*$"}
  - {name: 🌏 Meta, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "^((?!(直连|上海|北京|广州|深圳|杭州|徐州|江苏|浙江|南京|中国|国内|回国|China|Mainland|CN|SHA|PEK|CAN|SZX|HGH)).)*$"}
  - {name: 🐦 X, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "^((?!(直连|上海|北京|广州|深圳|杭州|徐州|江苏|浙江|南京|中国|国内|回国|China|Mainland|CN|SHA|PEK|CAN|SZX|HGH)).)*$"}
  - {name: 📱 社交媒体, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "^((?!(直连|上海|北京|广州|深圳|杭州|徐州|江苏|浙江|南京|中国|国内|回国|China|Mainland|CN|SHA|PEK|CAN|SZX|HGH)).)*$"}
  
  # --- 生产力与协作 ---
  - {name: 💼 办公, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "^((?!(直连|上海|北京|广州|深圳|杭州|徐州|江苏|浙江|南京|中国|国内|回国|China|Mainland|CN|SHA|PEK|CAN|SZX|HGH)).)*$"}

  # --- 开发者与云服务 ---
  - {name: 🧑‍💻 开发, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "^((?!(直连|上海|北京|广州|深圳|杭州|徐州|江苏|浙江|南京|中国|国内|回国|China|Mainland|CN|SHA|PEK|CAN|SZX|HGH)).)*$"}
  - {name: ☁️ 云服务, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "^((?!(直连|上海|北京|广州|深圳|杭州|徐州|江苏|浙江|南京|中国|国内|回国|China|Mainland|CN|SHA|PEK|CAN|SZX|HGH)).)*$"}
  

  # --- 流媒体与娱乐 ---
  - {name: 📺 流媒体, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "^((?!(直连|上海|北京|广州|深圳|杭州|徐州|江苏|浙江|南京|中国|国内|回国|China|Mainland|CN|SHA|PEK|CAN|SZX|HGH)).)*$"}
  - {name: 📺 流媒体（解锁）, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "^((?!(直连|上海|北京|广州|深圳|杭州|徐州|江苏|浙江|南京|中国|国内|回国|China|Mainland|CN|SHA|PEK|CAN|SZX|HGH|香港|hk|HK)).)*$"}
  - {name: 🎧 音乐, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "^((?!(直连|上海|北京|广州|深圳|杭州|徐州|江苏|浙江|南京|中国|国内|回国|China|Mainland|CN|SHA|PEK|CAN|SZX|HGH)).)*$"}
  
  # --- 游戏通用 ---
  - {name: 🎮 游戏, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "^((?!(直连|上海|北京|广州|深圳|杭州|徐州|江苏|浙江|南京|中国|国内|回国|China|Mainland|CN|SHA|PEK|CAN|SZX|HGH)).)*$"}
  
    # --- 东南亚选优 ---
  - {name: 🌏️ 东南亚, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?i)新加坡|狮城|马来西亚|吉隆坡|马六甲|槟城|印尼|雅加达|巴厘岛|菲律宾|马尼拉|越南|胡志明市|河内|泰国|曼谷|清迈"}
  
  # --- 基础工具 ---
  - {name: 🔍 Google, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "^((?!(直连|上海|北京|广州|深圳|杭州|徐州|江苏|浙江|南京|中国|国内|回国|China|Mainland|CN|SHA|PEK|CAN|SZX|HGH|香港|HK|hk)).)*$"}
  - {name: 🪟 微软, type: select, proxies: [DIRECT, 🚀 默认代理, ⚡ 自动选择]} 
  - {name: 💳 海外支付, type: select, proxies: [⚡ 自动选择, 🚀 默认代理, DIRECT]}
  - {name: 🚫 广告拦截, type: select, proxies: [REJECT, DIRECT]}
  - {name: 🧱 漏网之鱼, type: select, proxies: [🚀 默认代理, DIRECT, ⚡ 自动选择]}

