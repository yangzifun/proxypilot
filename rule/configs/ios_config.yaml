# 更新时间: 2026-03-08
# 模板类型: IOS 专用模板 - 内存优化版 (50MB 限制)
# 作者: YZFN
# 说明:
# 1) 精简策略组与规则集，减少内存占用
# 2) 关闭嗅探，降低协议识别开销
# 3) 合并规则提供者，优先保障常用场景可用性

# ==========================================================
# 节点信息
# ==========================================================
proxies:
  - {name: 直连, type: direct}

# ==========================================================
# 全局配置
# ==========================================================
port: 7890
socks-port: 7891
mixed-port: 7893
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: false
log-level: warning
find-process-mode: 'off'
global-client-fingerprint: chrome
disable-keep-alive: true
profile:
  store-selected: true
  store-fake-ip: true

# ==========================================================
# 嗅探 (iOS 内存优化: 关闭)
# ==========================================================
sniffer:
  enable: false

# ==========================================================
# 入站
# ==========================================================
tun:
  enable: true
  stack: system
  dns-hijack: ["any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# ==========================================================
# DNS模块
# ==========================================================
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "rule-set:private_domain,cn_domain"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query

# ==========================================================
# 锚点配置
# ==========================================================
rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  class: &class {type: http, interval: 86400, behavior: classical, format: text}

# ==========================================================
# 出站策略 (Proxy Groups)
# ==========================================================
proxy-groups:
  # --- 底层自动选优 (降低频率，降低内存和CPU压力) ---
  - {name: ⚡ 自动选择, type: url-test, url: 'https://www.gstatic.com/generate_204', include-all: true, tolerance: 50, interval: 600, filter: "^((?!(直连|中国|国内|回国|CN|China|Mainland)).)*$"}
  - {name: 🇭🇰 香港自动, type: url-test, url: 'https://www.gstatic.com/generate_204', include-all: true, tolerance: 80, interval: 600, filter: "(?i)香港|HK|Hong Kong|HongKong"}
  - {name: 🇯🇵 日本自动, type: url-test, url: 'https://www.gstatic.com/generate_204', include-all: true, tolerance: 80, interval: 600, filter: "(?i)日本|JP|Japan|东京|大阪|埼玉|京都|福冈|名古屋|札幌"}
  - {name: 🇺🇸 美国自动, type: url-test, url: 'https://www.gstatic.com/generate_204', include-all: true, tolerance: 80, interval: 600, filter: "(?i)美国|US|USA|洛杉矶|旧金山|西雅图|纽约|弗吉尼亚|阿什本"}
  - {name: 🇸🇬 新加坡自动, type: url-test, url: 'https://www.gstatic.com/generate_204', include-all: true, tolerance: 80, interval: 600, filter: "(?i)新加坡|SG|Singapore|狮城"}
  - {name: 🇹🇼 台湾自动, type: url-test, url: 'https://www.gstatic.com/generate_204', include-all: true, tolerance: 20, interval: 300, filter: "(?i)台湾|台北|新北|台中|高雄|台南|桃园|新竹|基隆|嘉义|彰化|屏东|宜兰|花莲|台东|苗栗|南投|云林|澎湖|金门|马祖"}
  - {name: 🌐 全部节点, type: select, include-all: true}

  # --- 业务策略组 (精简) ---
  - {name: 🚀 默认代理, type: select, proxies: [⚡ 自动选择, 🇭🇰 香港自动, 🇹🇼 台湾自动, 🇯🇵 日本自动, 🇺🇸 美国自动, 🇸🇬 新加坡自动, 🌐 全部节点]}
  - {name: 🤖 AI 服务, type: select, proxies: [🇺🇸 美国自动, 🇹🇼 台湾自动, 🇯🇵 日本自动, 🇸🇬 新加坡自动, 🚀 默认代理]}
  - {name: 🌍 社交办公, type: select, proxies: [🚀 默认代理, ⚡ 自动选择, 🎯 直连]}
  - {name: 🎬 国际影视, type: select, proxies: [🚀 默认代理, ⚡ 自动选择, 🇭🇰 香港自动, 🇹🇼 台湾自动, 🇯🇵 日本自动, 🇺🇸 美国自动, 🇸🇬 新加坡自动]}
  - {name: 🎮 游戏平台, type: select, proxies: [🎯 直连, 🚀 默认代理, ⚡ 自动选择]}
  - {name: 🔍 Google, type: select, proxies: [🚀 默认代理, ⚡ 自动选择]}
  - {name: 🟦 Microsoft, type: select, proxies: [🎯 直连, 🚀 默认代理]}
  - {name: 🍎 Apple, type: select, proxies: [🎯 直连, 🚀 默认代理]}
  - {name: 🚀 Speedtest, type: select, proxies: [🎯 直连, 🚀 默认代理, ⚡ 自动选择]}
  - {name: 💳 PayPal, type: select, proxies: [🚀 默认代理, ⚡ 自动选择, 🎯 直连]}
  - {name: 🚫 广告拦截, type: select, proxies: [REJECT, DIRECT]}
  - {name: 🎯 直连, type: select, proxies: [DIRECT, 🚀 默认代理]}
  - {name: 🐟 漏网之鱼, type: select, proxies: [🚀 默认代理, 🎯 直连, ⚡ 自动选择]}

# ==========================================================
# 规则匹配 (Rules)
# ==========================================================
rules:
  # 1. 广告与直连基础
  - RULE-SET,category-ads-all,🚫 广告拦截
  - RULE-SET,private_domain,🎯 直连
  - RULE-SET,custom_direct,🎯 直连
  - IP-CIDR,192.168.0.0/16,🎯 直连,no-resolve
  - IP-CIDR,10.0.0.0/8,🎯 直连,no-resolve
  - IP-CIDR,172.16.0.0/12,🎯 直连,no-resolve
  - RULE-SET,cn_domain,🎯 直连
  - RULE-SET,cn_ip,🎯 直连,no-resolve

  # 2. 自定义代理补充
  - RULE-SET,proxylite,🚀 默认代理

  # 3. 核心业务
  - RULE-SET,ai,🤖 AI 服务
  - RULE-SET,telegram_domain,🌍 社交办公
  - RULE-SET,social_domain,🌍 社交办公
  - RULE-SET,github_domain,🌍 社交办公
  - RULE-SET,media_domain,🎬 国际影视
  - RULE-SET,google_domain,🔍 Google
  - RULE-SET,microsoft_domain,🟦 Microsoft
  - RULE-SET,apple_domain,🍎 Apple
  - RULE-SET,steam_domain,🎮 游戏平台
  - RULE-SET,speedtest_domain,🚀 Speedtest
  - RULE-SET,paypal_domain,💳 PayPal
  - RULE-SET,tiktok_domain,🎬 国际影视



  # 5. 兜底
  - RULE-SET,gfw_domain,🚀 默认代理
  - MATCH,🐟 漏网之鱼

# ==========================================================
# 规则源
# ==========================================================
rule-providers:
  # 基础与系统
  category-ads-all: { <<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.mrs"}
  private_domain: { <<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs"}
  custom_direct: { <<: *class, url: "https://github.com/yangzifun/proxypilot/raw/refs/heads/main/rule/direct.list"}
  proxylite: { <<: *class, url: "https://github.com/yangzifun/proxypilot/raw/refs/heads/main/rule/proxy.list"}

  # 聚合规则 (内存优化)
  ai: { <<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ai-!cn.mrs"}
  social_domain: { <<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-social-media-!cn.mrs"}
  media_domain: { <<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-media-!cn.mrs"}

  # 关键服务
  telegram_domain: { <<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/telegram.mrs"}
  github_domain: { <<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/github.mrs"}
  google_domain: { <<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/google.mrs"}
  microsoft_domain: { <<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/microsoft.mrs"}
  apple_domain: { <<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/apple-cn.mrs"}
  steam_domain: { <<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/steam.mrs"}
  speedtest_domain: { <<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/ookla-speedtest.mrs"}
  paypal_domain: { <<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/paypal.mrs"}
  tiktok_domain: { <<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/tiktok.mrs"}

  # 大陆与兜底
