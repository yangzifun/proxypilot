# 生成时间: 2026-01-13
# 模板类型: IP分流模板 - 基于IP地址进行智能分流，提供更精准的路由

# ==========================================================
# 节点与全局配置 
# ==========================================================
proxies:
  - {name: 直连, type: direct}

port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
  default-nameserver: [223.5.5.5, 119.29.29.29]
  proxy-server-nameserver: [https://dns.alidns.com/dns-query]
  nameserver: [8.8.8.8, 1.1.1.1]

# ==========================================================
# 锚点配置
# ==========================================================
rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}

# ==========================================================
# 出站策略 (Proxy Groups)
# ==========================================================
proxy-groups:
  - {name: 🚀 默认代理, type: select, include-all: true, filter: "^((?!(直连)).)*$", proxies: [⚡ 自动选择, 🌐 全部节点]}
  
  # --- 专项 IP 分流组 ---
  - {name: 🔍 Google IP, type: select, proxies: [🇺🇸 美国自动, ⚡ 自动选择]}
  - {name: 📲 Telegram IP, type: select, proxies: [🇸🇬 新加坡自动, 🇭🇰 香港自动]}
  - {name: 🌏 Meta IP, type: select, proxies: [🚀 默认代理, 🇺🇸 美国自动]}
  - {name: 🐦 Twitter IP, type: select, proxies: [🚀 默认代理, 🇯🇵 日本自动]}
  - {name: 🎥 Netflix IP, type: select, proxies: [⚡ 自动选择, 🇸🇬 新加坡自动]}
  - {name: ☁️ Cloudflare IP, type: select, proxies: [🎯 直连, 🚀 默认代理]} # CF经常被用于CDN，直连通常更快
  - {name: 📦 Amazon IP, type: select, proxies: [🚀 默认代理, 🇺🇸 美国自动]}

  # --- 地区 IP 分流组 ---
  - {name: 🇭🇰 香港 IP, type: select, include-all: true, filter: "(?i)香港|HK", proxies: [🇭🇰 香港自动]}
  - {name: 🇯🇵 日本 IP, type: select, include-all: true, filter: "(?i)日本|JP", proxies: [🇯🇵 日本自动]}
  - {name: 🇺🇸 美国 IP, type: select, include-all: true, filter: "(?i)美国|US", proxies: [🇺🇸 美国自动]}
  - {name: 🇸🇬 新加坡 IP, type: select, include-all: true, filter: "(?i)新加坡|SG", proxies: [🇸🇬 新加坡自动]}
  
  - {name: 🎯 直连, type: select, proxies: [DIRECT, 🚀 默认代理]}
  - {name: 🐟 漏网之鱼, type: select, proxies: [🚀 默认代理, 🎯 直连]}

  # --- 底层测速组 (保持不变) ---
  - {name: ⚡ 自动选择, type: url-test, include-all: true, tolerance: 20, interval: 300}
  - {name: 🌐 全部节点, type: select, include-all: true}
  - {name: 🇭🇰 香港自动, type: url-test, include-all: true, filter: "(?i)香港|HK|Hong Kong|HongKong|HKSAR|HKG|Hkg|Hk"}
  - {name: 🇯🇵 日本自动, type: url-test, include-all: true, filter: "(?i)日本|JP|Japan|Tokyo|Osaka|Saitama|Kyoto|JP-|Japan|TYO|OSA|东京|大阪|埼玉|京都"}
  - {name: 🇺🇸 美国自动, type: url-test, include-all: true, filter: "(?i)美国|US|USA|United States|America|States|US-|Virginia|VA|Ashburn|弗吉尼亚|维吉尼亚|阿什本|California|CA|Los Angeles|San Francisco|San Jose|Santa Clara|Santa Monica|Sacramento|Fremont|洛杉矶|旧金山|圣何塞|加州|New York|NY|New Jersey|NJ|纽约|新泽西|Texas|TX|Dallas|Houston|Austin|德克萨斯|德州|达拉斯|休斯顿|Washington|WA|Seattle|西雅图|Chicago|IL|芝加哥|Florida|FL|Miami|佛罗里达|迈阿密|Oregon|OR|Portland|波特兰|Nevada|NV|Las Vegas|拉斯维加斯|Arizona|AZ|Phoenix|凤凰城|Georgia|Atlanta|亚特兰大|Utah|Salt Lake|盐湖城|Boston|波士顿"}
  - {name: 🇸🇬 新加坡自动, type: url-test, include-all: true, filter: "(?i)新加坡|SG|Singapore|Lion City|SGP|SIN|SGP|狮城"}

# ==========================================================
# 规则匹配 (Rules) - 重点扩展 IP 规则
# ==========================================================
rules:
  # 1. 基础连接
  - GEOIP,LAN,🎯 直连

  # 2. 专项 IP 段匹配 (no-resolve 模式防止 DNS 解析死循环)
  - RULE-SET,google_ip,🔍 Google IP,no-resolve
  - RULE-SET,telegram_ip,📲 Telegram IP,no-resolve
  - RULE-SET,facebook_ip,🌏 Meta IP,no-resolve
  - RULE-SET,twitter_ip,🐦 Twitter IP,no-resolve
  - RULE-SET,netflix_ip,🎥 Netflix IP,no-resolve
  - RULE-SET,cloudflare_ip,☁️ Cloudflare IP,no-resolve
  - RULE-SET,amazon_ip,📦 Amazon IP,no-resolve
  
  # 3. 大陆 IP 排除
  - RULE-SET,cn_ip,🎯 直连,no-resolve

  # 4. GEOIP 国家级分流 (作为专项 IP 段之外的补充)
  - GEOIP,HK,🇭🇰 香港 IP
  - GEOIP,JP,🇯🇵 日本 IP
  - GEOIP,US,🇺🇸 美国 IP
  - GEOIP,SG,🇸🇬 新加坡 IP
  - GEOIP,CN,🎯 直连

  # 5. 兜底
  - MATCH,🐟 漏网之鱼

# ==========================================================
# 规则源 (Rule Providers)
# ==========================================================
rule-providers:
  # 国内 IP
  cn_ip: { <<: *ip, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs"}
  
  # 重点服务 IP 段
  google_ip: { <<: *ip, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/google.mrs"}
  telegram_ip: { <<: *ip, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/telegram.mrs"}
  facebook_ip: { <<: *ip, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/facebook.mrs"}
  twitter_ip: { <<: *ip, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/twitter.mrs"}
  netflix_ip: { <<: *ip, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/netflix.mrs"}
  
  # 云服务商 IP 段 (作为补充)
  cloudflare_ip: { <<: *ip, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cloudflare.mrs"}
  amazon_ip: { <<: *ip, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/amazon.mrs"}