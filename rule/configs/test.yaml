# 生成时间: 2026-02-02
# 模板类型: 极致极致内存优化版 (MRS 驱动)

# ==========================================================
# 全局配置
# ==========================================================
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning

# 【关键优化】关闭 geodata 模式，不加载 geoip.dat 和 geosite.dat
geodata-mode: false 
# 既然关闭了 geodata-mode，下面这些 URL 可以注释掉以节省空间
# geox-url:
#   geoip: "..."
#   geosite: "..."

find-process-mode: 'off' # 减少进程扫描的 CPU 和内存占用
global-client-fingerprint: chrome

profile:
  store-selected: true
  store-fake-ip: true

# ==========================================================
# 嗅探与入站
# ==========================================================
sniffer:
  enable: true
  sniff:
    HTTP: { ports: [80, 8080-8880], override-destination: true }
    TLS: { ports: [443, 8443] }
    QUIC: { ports: [443, 8443] }

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# ==========================================================
# DNS 模块
# ==========================================================
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter:
    - "rule-set:private_domain,cn_domain"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
  nameserver:
    - 223.5.5.5
    - 8.8.8.8

# ==========================================================
# 锚点配置 (统一 MRS 格式)
# ==========================================================
rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}

# ==========================================================
