# 生成时间: 2026-02-04
# 模板类型: 全球上网轻量版 - 极简分组，强力分流
# 核心逻辑: 海外常用走代理(可按需选区)，大陆服务强制直连，漏网之鱼走默认。

# ==========================================================
# 全局配置
# ==========================================================
port: 7890
socks-port: 7891
mixed-port: 7893
allow-lan: true
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

dns:
  enable: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter: ['+.baidu.com', '+.market.xiaomi.com', 'rule-set:private_domain,cn_domain']
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - 8.8.8.8
    - 1.1.1.1

# ==========================================================
# 锚点配置 (引用)
# ==========================================================
rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  class: &class {type: http, interval: 86400, behavior: classical, format: text}

# ==========================================================
# 出站策略 (Proxy Groups - 已精简合并)
# ==========================================================
proxy-groups:
  # 1. 主开关
  - {name: 🚀 默认代理, type: select, include-all: true, proxies: [⚡ 自动选择, 🌐 全部节点, 🎯 全球直连]}

  # 2. AI 服务 (合并 OpenAI/Gemini/Claude)
  - {name: 🤖 AI 服务, type: select, proxies: [🇺🇸 美国自动, 🇯🇵 日本自动, 🇸🇬 新加坡自动, 🇹🇼 台湾自动, 🇩🇪 德国自动, 🚀 默认代理]}

  # 3. 社交与办公 (合并 Telegram/Meta/Twitter/Discord/GitHub)
  - {name: 🌍 社交办公, type: select, proxies: [⚡ 自动选择, 🇭🇰 香港自动, 🇯🇵 日本自动, 🇸🇬 新加坡自动, 🇺🇸 美国自动, 🚀 默认代理, 🎯 全球直连]}

  # 4. 国际流媒体 (合并 YouTube/Netflix/Disney+/TikTok/Spotify)
  - {name: 🎬 国际影视, type: select, proxies: [⚡ 自动选择, 🇭🇰 香港自动, 🇯🇵 日本自动, 🇸🇬 新加坡自动, 🇺🇸 美国自动, 🇹🇼 台湾自动, 🚀 默认代理]}

  # 5. 游戏/微软/苹果 (合并 Steam/Epic/Microsoft/Apple)
  - {name: 🎮 游戏办公, type: select, proxies: [🎯 全球直连, 🚀 默认代理, 🇯🇵 日本自动, 🇺🇸 美国自动, 🇭🇰 香港自动]}

  - {name: 🚫 广告拦截, type: select, proxies: [REJECT, DIRECT]}
  - {name: 🎯 全球直连, type: select, proxies: [DIRECT, 🚀 默认代理]}

  # --- 底层自动选优 (包含你要求的所有细化正则) ---
  - {name: ⚡ 自动选择, type: url-test, include-all: true, url: 'http://cp.cloudflare.com/generate_204', interval: 300, filter: "^((?!(回国|中国|China|CN|Mainland)).)*$"}
  
  - {name: 🇭🇰 香港自动, type: url-test, include-all: true, url: 'http://cp.cloudflare.com/generate_204', interval: 300, filter: "(?i)香港|HK|HongKong"}
  
  - {name: 🇯🇵 日本自动, type: url-test, include-all: true, url: 'http://cp.cloudflare.com/generate_204', interval: 300, filter: "(?i)日本|Japan|JP|东京|Tokyo|大阪|Osaka|埼玉|Saitama|京都|Kyoto|名古屋|Nagoya|福冈|Fukuoka|札幌|Sapporo|横滨|Yokohama|仙台|Sendai|千叶|Chiba|神户|Kobe|奈良|Nara|广岛|Hiroshima|静冈|Shizuoka|冲绳|Okinawa"}
  
  - {name: 🇺🇸 美国自动, type: url-test, include-all: true, url: 'http://cp.cloudflare.com/generate_204', interval: 300, filter: "(?i)美国|USA|US|洛杉矶|纽约|旧金山|西雅图|加州|波特兰"}
  
  - {name: 🇸🇬 新加坡自动, type: url-test, include-all: true, url: 'http://cp.cloudflare.com/generate_204', interval: 300, filter: "(?i)新加坡|Singapore|SG|狮城"}
  
  - {name: 🇹🇼 台湾自动, type: url-test, include-all: true, url: 'http://cp.cloudflare.com/generate_204', interval: 300, filter: "(?i)台湾|Taiwan|TW|台北|TPE|台中|高雄|新竹|桃园"}
  
  - {name: 🇩🇪 德国自动, type: url-test, include-all: true, url: 'http://cp.cloudflare.com/generate_204', interval: 300, filter: "(?i)德国|Germany|DE|法兰克福|FRA|柏林|慕尼黑"}

  - {name: 🌐 全部节点, type: select, include-all: true}

# ==========================================================
# 规则匹配 (Rules)
# ==========================================================
rules:
  - RULE-SET,category-ads-all,🚫 广告拦截
  - RULE-SET,private_domain,🎯 全球直连

  # AI
  - RULE-SET,openai,🤖 AI 服务
  - RULE-SET,gemini,🤖 AI 服务
  - RULE-SET,claude,🤖 AI 服务
  - RULE-SET,ai,🤖 AI 服务
  
  # 影视
  - RULE-SET,youtube_domain,🎬 国际影视
  - RULE-SET,netflix_domain,🎬 国际影视
  - RULE-SET,disney_domain,🎬 国际影视
  - RULE-SET,tiktok_domain,🎬 国际影视
  - RULE-SET,spotify_domain,🎬 国际影视
  
  # 社交办公
  - RULE-SET,telegram_domain,🌍 社交办公
  - RULE-SET,twitter_domain,🌍 社交办公
  - RULE-SET,facebook_domain,🌍 社交办公
  - RULE-SET,discord_domain,🌍 社交办公
  - RULE-SET,github_domain,🌍 社交办公
  - RULE-SET,google_domain,🌍 社交办公
  
  # 系统与游戏
  - RULE-SET,microsoft_domain,🎮 游戏办公
  - RULE-SET,apple_domain,🎯 全球直连
  - RULE-SET,steam_domain,🎮 游戏办公
  - RULE-SET,speedtest_domain,🎯 全球直连

  # 地区分流补充
  - GEOIP,HK,🇭🇰 香港自动,no-resolve
  - GEOIP,TW,🇹🇼 台湾自动,no-resolve
  - GEOIP,JP,🇯🇵 日本自动,no-resolve
  - GEOIP,SG,🇸🇬 新加坡自动,no-resolve
  - GEOIP,US,🇺🇸 美国自动,no-resolve

  # 大陆服务全部 DIRECT (强制直连)
  - RULE-SET,cn_domain,🎯 全球直连
  - GEOIP,CN,🎯 全球直连,no-resolve
  
  # 兜底：未匹配到的走默认代理
  - MATCH,🚀 默认代理

