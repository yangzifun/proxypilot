# 生成时间: 2026-01-13
# 模板类型: 回国模板 - 针对海外用户访问国内服务优化
# 模板说明：
#   1、香港代理回国加速服务利用CN2 GIA优质带宽、智能路由优化及全球节点布局，显著降低跨境网络延迟，解决海外用户访问中国内地网站、游戏和应用的卡顿问题。

# ==========================================================
# 节点信息
# ==========================================================
proxies:
  - {name: 直连, type: direct}

# ==========================================================
# 全局配置 
# ==========================================================
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
find-process-mode: 'off'
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
disable-keep-alive: false
profile:
  store-selected: true
  store-fake-ip: true


# ==========================================================
# 嗅探
# ==========================================================
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.v2ex.com"
  skip-domain:
    - "+.baidu.com"

# ==========================================================
# 入站  
# ==========================================================
tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# ==========================================================
# DNS模块
# ==========================================================
dns:
  enable: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - 1.1.1.1
    - 8.8.8.8
 
# ==========================================================
# 锚点配置
# ==========================================================
rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}

# ==========================================================
# 出站策略 (Proxy Groups) - 增加地区分组
# ==========================================================
proxy-groups:
  # 总开关：你可以手动切换地区或选全自动
  - {name: 🇨🇳 回国核心, type: select, proxies: [⚡ 自动选择, 🏙️ 上海自动, 🏛️ 北京自动, 🌆 深圳自动, 🇭🇰 香港自动, 🎯 直连]}

  # 影音娱乐
  - {name: 📺 大陆影音, type: select, proxies: [⚡ 自动选择, 🏙️ 上海自动, 🏛️ 北京自动, 🌆 深圳自动, 🇭🇰 香港自动, 🎯 直连]}

  # 游戏加速
  - {name: 🎮 国服游戏, type: select, proxies: [⚡ 自动选择, 🏙️ 上海自动, 🏛️ 北京自动, 🌆 深圳自动, 🇭🇰 香港自动, 🎯 直连]}

  # 漏网之鱼
  - {name: 🐟 漏网之鱼, type: select, proxies: [🎯 直连, ⚡ 自动选择, 🇭🇰 香港自动]}

  # 广告拦截
  - {name: 🚫 广告拦截, type: select, proxies: [REJECT, DIRECT]}

  # --- 地区自动选优策略 ---
  - {name: ⚡ 自动选择, type: url-test, include-all: true, filter: "(?i)上海|SH|Shanghai|北京|BJ|Beijing|深圳|SZ|Shenzhen|广州|GD|Guangzhou|杭州|HZ|Hangzhou|江苏|JS|Jiangsu|浙江|ZJ|Zhejiang|中国|CN|China|香港|HK|HongKong", url: "http://cp.cloudflare.com/generate_204", interval: 300}
  
  - {name: 🏙️ 上海自动, type: url-test, include-all: true, filter: "(?i)上海|SH|Shanghai", url: "http://connect.rom.miui.com/generate_204", interval: 300}
  
  - {name: 🏛️ 北京自动, type: url-test, include-all: true, filter: "(?i)北京|BJ|Beijing", url: "http://connect.rom.miui.com/generate_204", interval: 300}
  
  - {name: 🌆 深圳自动, type: url-test, include-all: true, filter: "(?i)深圳|SZ|Shenzhen", url: "http://connect.rom.miui.com/generate_204", interval: 300}
  
  - {name: 🇭🇰 香港自动, type: url-test, include-all: true, filter: "(?i)香港|HK|HongKong", url: "http://www.google.com.hk/generate_204", interval: 300}

  - {name: 🎯 直连, type: select, proxies: [DIRECT]}

# ==========================================================
# 规则匹配 (Rules)
# ==========================================================
rules:
  - RULE-SET,category-ads-all,🚫 广告拦截

  # 影音分流
  - RULE-SET,bilibili_domain,📺 大陆影音
  - RULE-SET,iqiyi_domain,📺 大陆影音
  - RULE-SET,tencent_video,📺 大陆影音
  - RULE-SET,netease_music,📺 大陆影音
  - RULE-SET,youku_domain,📺 大陆影音

  # 社交与支付 (回国节点)
  - RULE-SET,tencent_domain,🇨🇳 回国核心
  - RULE-SET,alibaba_domain,🇨🇳 回国核心
  - RULE-SET,sina_domain,🇨🇳 回国核心

  # 游戏分流
  - RULE-SET,games_cn,🎮 国服游戏

  # 兜底大陆流量
  - RULE-SET,cn_domain,🇨🇳 回国核心
  - RULE-SET,cn_ip,🇨🇳 回国核心,no-resolve

  # 海外流量直连
  - GEOIP,LAN,🎯 直连
  - RULE-SET,google_domain,🎯 直连
  - RULE-SET,youtube_domain,🎯 直连
  
  - MATCH,🐟 漏网之鱼

# ==========================================================
# 规则源
# ==========================================================
rule-providers:
