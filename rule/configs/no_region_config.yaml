# 生成时间: 2026-02-15
# 模板类型: 非区域分组 - 基础无区域分组配置模板，包含核心节点和常用规则，它直接从你的订阅节点列表中抓取关键词。
# 作者: YZFN
# ==========================================================
# 节点信息
# ==========================================================
proxies:
  - {name: 直连, type: direct}

# ==========================================================
# 全局配置 
# ==========================================================
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
find-process-mode: 'off'
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
disable-keep-alive: false
profile:
  store-selected: true
  store-fake-ip: true


# ==========================================================
# 嗅探
# ==========================================================
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.v2ex.com"
  skip-domain:
    - "+.baidu.com"

# ==========================================================
# 入站
# ==========================================================  
tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# ==========================================================
# DNS模块
# ==========================================================
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "rule-set:private_domain,cn_domain"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "+.market.xiaomi.com"
  default-nameserver:
   - 223.5.5.5
   - 223.6.6.6
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  # namesever尽量用运营商提供的DNS
  nameserver:
    - 8.8.8.8
    - 1.1.1.1
 
# ==========================================================
# 锚点配置
# ==========================================================
rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  class: &class {type: http, interval: 86400, behavior: classical, format: text}

# ==========================================================
# 出站策略 (Proxy Groups)
# ==========================================================
proxy-groups:
  # --- 1. 默认代理 (总开关) ---
  # 自动选择延迟最低的非中国大陆节点作为默认出口
  - name: 🚀 默认代理
    type: url-test
    url: 'https://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 50
    include-all: true
    filter: "^((?!(直连|中国|China|CN|回国|北京|上海|广州|深圳|杭州|成都|南京|武汉|天津|重庆|西安|苏州|江苏|浙江|广东|山东|福建|安徽|河南|湖北|湖南|江西|河北|山西|辽宁|吉林|黑龙江|海南|四川|贵州|云南|甘肃|青海|内蒙古|广西|西藏|宁夏|新疆)).)*$"

