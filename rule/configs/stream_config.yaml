# 生成时间: 2026-01-13
# 模板类型: 视频优化模板 - 针对视频流媒体和直播优化，提供更好的观看体验
# 作者: YZFN
# ==========================================================
# 全局配置 (影视加速优化)
# ==========================================================
port: 7890
socks-port: 7891
mixed-port: 7893
allow-lan: true
unified-delay: true
tcp-concurrent: true
log-level: warning
# 影视优化：嗅探强制开启，确保流媒体 CDN 被正确识别
sniffer:
  enable: true
  sniff:
    HTTP: {ports: [80, 8080-8880], override-destination: true}
    TLS: {ports: [443, 8443], override-destination: true}
    QUIC: {ports: [443, 8443], override-destination: true}
  force-domain:
    - "+.netflix.com"
    - "+.nflxvideo.net"
    - "+.disney.com"
    - "+.googlevideo.com"
    # 新增强制嗅探域名以优化新加入的流媒体服务
    - "+.primevideo.com"
    - "+.hulu.com"
    - "+.media-content.apple.com"
    - "+.peacocktv.com"
    - "+.tvb.com"
    - "+.spotify.com"
    - "+.hbo.com" # HBO Max/Max
    - "+.paramountplus.com"
    - "+.discoveryplus.com"
    - "+.abema.tv"
    - "+.viu.com"
    - "+.gamer.com.tw" # Bahamut

# ==========================================================
# 出站策略 (影视分流专用 - 每个服务独立一组)
# ==========================================================
proxy-groups:
  # 1. 总开关
  - {name: 🚀 默认代理, type: select, proxies: [⚡ 自动选择, 🇭🇰 香港流媒体, 🇹🇼 台湾流媒体, 🇯🇵 日本流媒体, 🇸🇬 新加坡流媒体, 🇺🇸 美国流媒体]}

  # 2. 核心影视分流 (每个服务单独一组)
  
  # Netflix：建议锁定一个你最常用的区域，防止 IP 频繁跳动导致被判为代理
  - {name: 🎥 Netflix, type: select, proxies: [🇸🇬 新加坡流媒体, 🇭🇰 香港流媒体, 🇹🇼 台湾流媒体, 🇯🇵 日本流媒体, 🇺🇸 美国流媒体]}
  
  # YouTube：4K 视频通过负载均衡（consistent-hashing）叠加所有节点带宽，秒开神器
  - {name: 🎬 YouTube, type: load-balance, strategy: consistent-hashing, include-all: true, filter: "(?i)香港|HK|日本|JP|新加坡|SG", url: 'http://www.gstatic.com/generate_204', interval: 300}

  # Disney+：推荐新加坡或美国，版权最全
  - {name: 🎞️ Disney+, type: select, proxies: [🇸🇬 新加坡流媒体, 🇺🇸 美国流媒体, 🇭🇰 香港流媒体, 🇯🇵 日本流媒体]}

  # Amazon Prime Video：全球化服务，但区域内容有差异
  - {name: 📺 Prime Video, type: select, proxies: [🇺🇸 美国流媒体, 🇸🇬 新加坡流媒体, 🇯🇵 日本流媒体, 🇭🇰 香港流媒体, 🚀 默认代理]}

  # Apple TV+：全球化服务，内容有区域差异
  - {name: 🍎 Apple TV+, type: select, proxies: [🇺🇸 美国流媒体, 🇭🇰 香港流媒体, 🇯🇵 日本流媒体, 🇸🇬 新加坡流媒体, ⚡ 自动选择]}

  # Hulu：主要面向美国用户
  - {name: 🟢 Hulu, type: select, proxies: [🇺🇸 美国流媒体, 🚀 默认代理]}

  # Max (原HBO Max)：主要面向美国和部分欧洲拉美地区
  - {name: 🟠 Max, type: select, proxies: [🇺🇸 美国流媒体, 🚀 默认代理]}

  # Paramount+：主要面向美国及部分国际市场
  - {name: 🔵 Paramount+, type: select, proxies: [🇺🇸 美国流媒体, 🚀 默认代理]}

  # Peacock：主要面向美国用户
  - {name: 🦚 Peacock, type: select, proxies: [🇺🇸 美国流媒体, 🚀 默认代理]}

  # Discovery+：主要面向美国、欧洲及部分亚洲市场
  - {name: 💡 Discovery+, type: select, proxies: [🇺🇸 美国流媒体, 🇸🇬 新加坡流媒体, 🚀 默认代理]}

  # AbemaTV：日本独家流媒体服务
  - {name: 🌸 AbemaTV, type: select, proxies: [🇯🇵 日本流媒体, 🚀 默认代理]}

  # Viu：主要面向亚洲市场 (香港、新加坡、台湾等)
  - {name: 🟣 Viu, type: select, proxies: [🇭🇰 香港流媒体, 🇸🇬 新加坡流媒体, 🇹🇼 台湾流媒体, 🚀 默认代理]}

  # TVB：香港电视广播有限公司的流媒体服务
  - {name: 📺 TVB, type: select, proxies: [🇭🇰 香港流媒体, 🇸🇬 新加坡流媒体, 🚀 默认代理]}

  # Bahamut Anime (巴哈姆特动画疯)：主要面向台湾用户
  - {name: 🎮 Bahamut, type: select, proxies: [🇹🇼 台湾流媒体, 🚀 默认代理]}

  # Spotify：全球音乐流媒体服务
  - {name: 🎵 Spotify, type: select, proxies: [⚡ 自动选择, 🇺🇸 美国流媒体, 🇸🇬 新加坡流媒体, 🇭🇰 香港流媒体]}

  # 3. 基础工具与社交 (沿用你的配置)
  - {name: 🤖 AI 服务, type: select, proxies: [🇺🇸 美国自动, 🇯🇵 日本自动, 🇸🇬 新加坡自动]}
  - {name: 📲 Telegram, type: select, proxies: [⚡ 自动选择, 🇭🇰 香港自动, 🇸🇬 新加坡自动]}
  - {name: 🎯 直连, type: select, proxies: [DIRECT]}
  - {name: 🐟 漏网之鱼, type: select, proxies: [🚀 默认代理, 🎯 直连]}

  # 4. 底层影视测速池 (Tolerance 设为 50ms 防止视频播放中频繁跳节点)
  - {name: 🇭🇰 香港流媒体, type: url-test, include-all: true, tolerance: 50, filter: "(?i)香港|HK|Hong Kong|HongKong|HKSAR|HKG|Hkg|Hk"}
  - {name: 🇹🇼 台湾流媒体, type: url-test, include-all: true, tolerance: 50, filter: "(?i)台湾|TW|Taiwan|Taipei|TPE|Taichung|Hsinchu|Republic of China|ROC|TW-|台北|台中|新竹"}
  - {name: 🇯🇵 日本流媒体, type: url-test, include-all: true, tolerance: 50, filter: "(?i)日本|JP|Japan|Tokyo|Osaka|Saitama|Kyoto|JP-|Japan|TYO|OSA|东京|大阪|埼玉|京都"}
  - {name: 🇸🇬 新加坡流媒体, type: url-test, include-all: true, tolerance: 50, filter: "(?i)新加坡|SG|Singapore|Lion City|SGP|SIN|SGP|狮城"}
  - {name: 🇺🇸 美国流媒体, type: url-test, include-all: true, tolerance: 50, filter: "(?i)美国|US|USA|United States|America|States|US-|Virginia|VA|Ashburn|弗吉尼亚|维吉尼亚|阿什本|California|CA|Los Angeles|San Francisco|San Jose|Santa Clara|Santa Monica|Sacramento|Fremont|洛杉矶|旧金山|圣何塞|加州|New York|NY|New Jersey|NJ|纽约|新泽西|Texas|TX|Dallas|Houston|Austin|德克萨斯|德州|达拉斯|休斯顿|Washington|WA|Seattle|西雅图|Chicago|IL|芝加哥|Florida|FL|Miami|佛罗里达|迈阿密|Oregon|OR|Portland|波特兰|Nevada|NV|Las Vegas|拉斯维加斯|Arizona|AZ|Phoenix|凤凰城|Georgia|Atlanta|亚特兰大|Utah|Salt Lake|盐湖城|Boston|波士顿"}
  
  # 基础地区分组 (沿用)
  - {name: ⚡ 自动选择, type: url-test, include-all: true, tolerance: 20}
  - {name: 🇭🇰 香港自动, type: url-test, include-all: true, filter: "(?i)香港|HK|Hong Kong|HongKong|HKSAR|HKG|Hkg|Hk"}
  - {name: 🇺🇸 美国自动, type: url-test, include-all: true, filter: "(?i)美国|US|USA|United States|America|States|US-|Virginia|VA|Ashburn|弗吉尼亚|维吉尼亚|阿什本|California|CA|Los Angeles|San Francisco|San Jose|Santa Clara|Santa Monica|Sacramento|Fremont|洛杉矶|旧金山|圣何塞|加州|New York|NY|New Jersey|NJ|纽约|新泽西|Texas|TX|Dallas|Houston|Austin|德克萨斯|德州|达拉斯|休斯顿|Washington|WA|Seattle|西雅图|Chicago|IL|芝加哥|Florida|FL|Miami|佛罗里达|迈阿密|Oregon|OR|Portland|波特兰|Nevada|NV|Las Vegas|拉斯维加斯|Arizona|AZ|Phoenix|凤凰城|Georgia|Atlanta|亚特兰大|Utah|Salt Lake|盐湖城|Boston|波士顿"}
  - {name: 🇯🇵 日本自动, type: url-test, include-all: true, filter: "(?i)日本|JP|Japan|Tokyo|Osaka|Saitama|Kyoto|JP-|Japan|TYO|OSA|东京|大阪|埼玉|京都"}
  - {name: 🇸🇬 新加坡自动, type: url-test, include-all: true, filter: "(?i新加坡|SG|Singapore|Lion City|SGP|SIN|SGP|狮城"}
  - {name: 🇹🇼 台湾自动, type: url-test, include-all: true, filter: "(?i)台湾|TW|Taiwan|Taipei|TPE|Taichung|Hsinchu|Republic of China|ROC|TW-|台北|台中|新竹"}

