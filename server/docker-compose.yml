services:
  mysql:
    image: mysql:8.4
    container_name: proxypilot-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_as_cs
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-proxypilot}
      MYSQL_DATABASE: proxypilot
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-proxypilot}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: proxypilot-server
    env_file: .env
    environment:
      PP_ADDR: ":8080"
      PP_MYSQL_DSN: "root:${MYSQL_ROOT_PASSWORD:-proxypilot}@tcp(mysql:3306)/proxypilot?charset=utf8mb4&parseTime=false&loc=UTC"
      PP_AGENT_DIST_DIR: "/app/agent-dist"
      PP_BUCKET_DIR: "/app/data/bucket"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../agent/dist:/app/agent-dist:ro
      - ./data/bucket:/app/data/bucket
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # 可选：数据库可视化对拍用
  adminer:
    image: adminer:4
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
