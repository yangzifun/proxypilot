<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ProxyPilot</title>
<style>
  :root{
    --bg:#0a0c10; --card:#12161c; --line:#1f252e; --line2:#2a323d;
    --txt:#e9eef5; --muted:#8b98a9; --dim:#5c6878;
    --accent:#38bdf8; --ok:#34d399; --warn:#fbbf24; --bad:#fb7185;
    --mono:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:radial-gradient(120% 70% at 50% -10%, rgba(56,189,248,.10), transparent 60%), var(--bg);
    color:var(--txt);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;display:flex;justify-content:center;
  }
  .app{width:100%;max-width:420px;min-height:100%;padding:16px 18px 14px;display:flex;flex-direction:column}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .brand{display:flex;align-items:center;gap:9px}
  .logo{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
    background:rgba(56,189,248,.10);border:1px solid rgba(56,189,248,.28);color:var(--accent)}
  .brand span{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
  .icon-btn{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--card);
    color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:.15s}
  .icon-btn:hover{color:var(--txt);border-color:var(--line2)}
  main{flex:1;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;gap:2px;padding:34px 0 4px}

  /* 云环开关：外圈进度环 + 内圆 */
  .dial-wrap{position:relative;width:204px;height:204px;margin:2px 0 16px}
  .dial{position:absolute;inset:0;border-radius:50%;border:0;background:transparent;cursor:pointer;padding:0}
  .dial svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
  .dial .track{fill:none;stroke:#1b222b;stroke-width:3}
  /* 空闲时不显示进度弧：避免圆头线帽在顶部留下一个孤立小点 */
  .dial:not(.on):not(.busy):not(.err) .arc{opacity:0}
  .dial .arc{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;
    transform-box:fill-box;transform-origin:50% 50%;
    transition:stroke .25s,stroke-dashoffset .6s,stroke-dasharray .25s;
    stroke-dasharray:596; stroke-dashoffset:596}
  .dial .core{position:absolute;inset:18px;border-radius:50%;background:radial-gradient(circle at 50% 38%,#151b23,#0d1116 70%);
    border:1px solid #202833;display:grid;place-items:center;transition:.25s;text-align:center}
  .dial:hover .core{border-color:#2b3542;background:radial-gradient(circle at 50% 38%,#18202a,#0e1319 70%)}
  .dial .state{font-size:14px;font-weight:700;letter-spacing:.01em}
  .dial .hint{font-size:11px;color:var(--dim);margin-top:5px}
  .dial.on .arc{stroke:var(--ok);stroke-dasharray:596;stroke-dashoffset:0;animation:none}
  .dial.on .core{border-color:rgba(52,211,153,.45);box-shadow:0 0 34px rgba(52,211,153,.16) inset}
  .dial.busy .arc{stroke:var(--warn);stroke-dasharray:118 478;stroke-dashoffset:0;
    animation:dial-ring-spin 1.05s linear infinite}
  .dial.busy .core{animation:dial-core-pulse 1.8s ease-in-out infinite}
  .dial.err .arc{stroke:var(--bad);stroke-dasharray:596;stroke-dashoffset:0;animation:none}
  @keyframes dial-ring-spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  @keyframes dial-core-pulse{0%,100%{box-shadow:0 0 0 0 rgba(251,191,36,0)}50%{box-shadow:0 0 20px rgba(251,191,36,.10) inset}}

  .btn.danger{color:#f87171;border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.08)}
  .btn.danger:hover{background:rgba(248,113,113,.14)}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:11.5px;
    font-weight:600;border:1px solid var(--line);color:var(--muted);background:rgba(18,22,28,.6)}
  .badge .dot{width:6px;height:6px;border-radius:50%;background:var(--dim)}
  .badge.on{color:var(--ok);border-color:rgba(52,211,153,.32);background:rgba(52,211,153,.07)}
  .badge.on .dot{background:var(--ok)}
  .badge.busy{color:var(--warn);border-color:rgba(251,191,36,.32);background:rgba(251,191,36,.07)}
  .badge.busy .dot{background:var(--warn);animation:blink 1s infinite}
  .badge.err{color:var(--bad);border-color:rgba(251,113,133,.32);background:rgba(251,113,133,.07)}
  .badge.err .dot{background:var(--bad)}
  @keyframes blink{50%{opacity:.2}}

  /* ---------- 浮层（选择节点 / 对话框 / toast） ---------- */
  .sheet{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
  .sheet[hidden]{display:none!important}
  .sheet-mask{position:absolute;inset:0;background:rgba(3,6,10,.68);backdrop-filter:blur(3px);
    animation:fade-in .16s ease-out}
  .sheet-body{position:relative;width:min(360px,100%);max-height:min(70vh,520px);display:flex;flex-direction:column;
    border:1px solid var(--line2);border-radius:18px;background:linear-gradient(180deg,#11161d,#0d1218);
    box-shadow:0 28px 70px rgba(0,0,0,.62);animation:pop-in .18s cubic-bezier(.2,.9,.3,1.2);overflow:hidden}
  @keyframes fade-in{from{opacity:0}to{opacity:1}}
  @keyframes pop-in{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
  .sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
    padding:15px 16px 12px;border-bottom:1px solid var(--line)}
  .sheet-head b{font-size:13.5px}
  .sheet-sub{font-size:10.5px;color:var(--dim);margin-top:3px}
  .sheet-close{width:26px;height:26px;flex:0 0 auto;border-radius:8px;border:1px solid var(--line);
    background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:.15s}
  .sheet-close:hover{color:var(--txt);background:#1a2029}
  .sheet-list{overflow:auto;padding:8px;overscroll-behavior:contain}
  .sheet-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:11px;cursor:pointer;
    font-size:12.5px;border:1px solid transparent;transition:.14s}
  .sheet-row:hover{background:rgba(56,189,248,.08)}
  .sheet-row.sel{background:rgba(56,189,248,.12);border-color:rgba(56,189,248,.34)}
  .sheet-row .dot{width:6px;height:6px;border-radius:50%;background:var(--dim);flex:0 0 auto}
  .sheet-row .dot.up{background:var(--ok);box-shadow:0 0 6px rgba(52,211,153,.7)}
  .sheet-row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sheet-row .ep{color:var(--dim);font-size:10.5px;font-family:var(--mono)}
  .sheet-row.sel .nm{color:var(--accent);font-weight:600}

  /* 对话框 */
  .sheet-body.dialog{align-items:center;text-align:center;padding:24px 20px 18px;max-height:none}
  .dialog-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;margin-bottom:12px;
    background:rgba(56,189,248,.11);color:var(--accent);font-size:19px}
  .dialog-icon.warn{background:rgba(251,191,36,.12);color:var(--warn)}
  .dialog-icon.danger{background:rgba(251,113,133,.12);color:var(--bad)}
  .dialog-title{font-size:14px;font-weight:700;margin-bottom:6px}
  .dialog-text{font-size:12px;color:var(--muted);line-height:1.65;white-space:pre-wrap}
  .dialog-actions{display:flex;gap:10px;width:100%;margin-top:18px}
  .dialog-actions .btn{flex:1;width:auto}

  /* toast */
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:10000;
    padding:10px 16px;border-radius:11px;font-size:12px;font-weight:600;
    background:rgba(17,23,30,.96);border:1px solid var(--line2);color:var(--txt);
    box-shadow:0 12px 34px rgba(0,0,0,.5);animation:toast-in .2s ease-out}
  .toast[hidden]{display:none!important}
  .toast.ok{border-color:rgba(52,211,153,.4);color:var(--ok)}
  .toast.err{border-color:rgba(251,113,133,.4);color:var(--bad)}
  @keyframes toast-in{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}
  }
  .rows{width:100%;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
  .row{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--line);font-size:12.5px}
  .row:last-child{border-bottom:0}
  .row .k{color:var(--muted)}
  .row .v{font-family:var(--mono);font-size:12px;color:var(--txt);max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row.clickable{cursor:pointer}
  .row.clickable:hover .v{color:var(--accent)}
  .row.clickable .v::after{content:'⌄';margin-left:6px;color:var(--dim);font-family:system-ui}
  .row .v.ok{color:var(--ok)}
  .row .v.bad{color:var(--bad)}
  .notice{margin-top:12px;width:100%;font-size:11.5px;line-height:1.5;color:var(--warn);
    background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.22);border-radius:10px;padding:9px 11px}
  .notice:empty{display:none}
  .login{margin-top:14px;width:100%;text-align:center}
  .login .hint2{margin-top:8px;font-size:11px;color:var(--dim);line-height:1.6}
  .login button{width:100%}

  [hidden]{display:none!important}
#main.hide{display:none!important}
/* 安装向导 */
#details{display:none;flex-direction:column;gap:14px;padding-top:4px}
#details.show{display:flex}
#installer{display:none;flex-direction:column;gap:14px;padding-top:4px}
#installer.show{display:flex}
.inst-head{display:flex;align-items:center;gap:10px}
.inst-head h2{font-size:17px;margin:0;font-weight:600}
.inst-sub{font-size:12px;color:var(--muted);line-height:1.7}
.inst-box{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:14px;display:flex;flex-direction:column;gap:10px}
.inst-field{display:flex;flex-direction:column;gap:5px}
.inst-field label{font-size:11.5px;color:var(--muted)}
.inst-field input{background:#0d1117;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--txt);font-size:12.5px;outline:none}
.inst-field input:focus{border-color:#3b82f6}
.inst-check{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.inst-check input{width:15px;height:15px;accent-color:#3b82f6}
.inst-steps{display:flex;flex-direction:column;gap:2px}
.inst-step{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;font-size:12.5px;color:var(--dim);transition:.2s}
.inst-step.active{background:rgba(59,130,246,.10);color:var(--txt)}
.inst-step.done{color:#34d399}
.inst-step.err{color:#f87171}
.inst-dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line2);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:10px}
.inst-step.active .inst-dot{border-color:#3b82f6;border-top-color:transparent;animation:inst-spin .8s linear infinite}
.inst-step.done .inst-dot{border-color:#34d399;background:#34d399;color:#04120c}
.inst-step.err .inst-dot{border-color:#f87171;background:#f87171;color:#1a0505}
@keyframes inst-spin{to{transform:rotate(360deg)}}
.inst-bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.inst-bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3b82f6,#22d3ee);transition:width .3s}
.inst-actions{display:flex;gap:10px;margin-top:2px}
.inst-actions .btn{flex:1}
.inst-msg{font-size:12px;color:var(--muted);min-height:18px;line-height:1.6;word-break:break-all}
.inst-msg.ok{color:#34d399}
.inst-msg.err{color:#f87171}
/* 设置页 */
  #settings{display:none;flex-direction:column;gap:14px;padding-top:4px}
  #settings.show{display:flex}
  main.hide{display:none}
  .s-head{display:flex;align-items:center;gap:10px}
  .back{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--card);
    color:var(--muted);display:grid;place-items:center;cursor:pointer}
  .s-head h2{margin:0;font-size:14px;font-weight:700}
  .field label{display:block;font-size:11px;color:var(--dim);margin-bottom:6px}
  .field input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
    background:#0e1218;color:var(--txt);font-family:var(--mono);font-size:12px}
  .field input:focus{outline:none;border-color:rgba(56,189,248,.5)}
  .check{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .nodes-list{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
  .nrow{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12.5px}
  .nrow:last-child{border-bottom:0}
  .nrow:hover{background:#151a21}
  .nrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nrow .ep{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
  .nrow .st{width:6px;height:6px;border-radius:50%;background:var(--dim)}
  .nrow .st.up{background:var(--ok)}
  .nrow.sel{background:rgba(56,189,248,.07)}
  .nrow.sel .nm{color:var(--accent)}
  .btn{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);
    color:var(--txt);font-size:12.5px;font-weight:600;cursor:pointer}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#04121c}
  .btn.primary:hover{background:#7dd3fc}
  /* 设置页分组 */
  .group{border:1px solid var(--line);border-radius:14px;background:rgba(18,22,28,.55);
    padding:13px 14px;display:flex;flex-direction:column;gap:10px}
  .group-title{font-size:10.5px;font-weight:700;letter-spacing:.09em;color:var(--dim);text-transform:uppercase}
  .group .field label{margin-bottom:5px}
  .group .row.flat{border-bottom:0;padding:2px 0;font-size:12px}
  .group .hint2{font-size:10.5px;color:var(--dim);line-height:1.6;margin:-2px 0 0 22px}
  .btn.ghost{background:rgba(255,255,255,.03);border-color:var(--line)}
  .btn.ghost:hover{border-color:var(--line2);background:rgba(255,255,255,.06)}
  .btn:active{transform:translateY(1px)}
  .check input{width:15px;height:15px;accent-color:var(--accent)}
  /* 滚动条 */
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#242c37;border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:#313b48}
  ::-webkit-scrollbar-track{background:transparent}
  footer{margin-top:14px;display:flex;justify-content:space-between;font-size:10.5px;color:#3f4a58;font-family:var(--mono)}
.notice, .notice-row .notice, .rows .v, .detail-actions {
  -webkit-user-select: text;
  user-select: text;
}
.notice-row {
  display: flex;
  align-items: flex-start;
  gap: 8px;
}
.notice-row .notice { flex: 1; min-width: 0; }
.copybtn {
  flex: 0 0 auto;
  padding: 4px 10px;
  font-size: 12px;
  border-radius: 8px;
  border: 1px solid rgba(148, 163, 184, .45);
  background: transparent;
  color: inherit;
  cursor: pointer;
  opacity: .85;
}
.copybtn:hover { opacity: 1; border-color: rgba(148, 163, 184, .8); }
.copybtn.wide { width: 100%; padding: 9px 10px; margin-top: 10px; }
.detail-actions { display: flex; flex-direction: column; }
.nrow.nerr { color: #f43f5e; font-size: 12px; line-height: 1.6; word-break: break-all; }
.nrow.nacts { display: flex; gap: 8px; padding-top: 4px; }
.notice, .rows .v, .detail-actions {
  -webkit-user-select: text;
  user-select: text;
}
.notice-row { display: flex; align-items: flex-start; gap: 8px; }
.notice-row .notice { flex: 1; min-width: 0; }
.copybtn {
  flex: 0 0 auto;
  padding: 4px 10px;
  font-size: 12px;
  border-radius: 8px;
  border: 1px solid rgba(148, 163, 184, .45);
  background: transparent;
  color: inherit;
  cursor: pointer;
  opacity: .85;
}
.copybtn:hover { opacity: 1; border-color: rgba(148, 163, 184, .8); }
.copybtn.wide { width: 100%; padding: 9px 10px; margin-top: 10px; }
.detail-actions { display: flex; flex-direction: column; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></svg>
      </div>
      <span>ProxyPilot</span>
    </div>
    <button class="icon-btn" id="gear" title="首选项">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
    </button>
  </header>

  <main id="main">
    <div class="dial-wrap">
      <button class="dial" id="dial" title="连接 / 断开">
        <svg viewBox="0 0 200 200"><circle class="track" cx="100" cy="100" r="95"/><circle class="arc" cx="100" cy="100" r="95"/></svg>
        <div class="core">
          <div>
            <div class="state" id="stateText">未连接</div>
            <div class="hint" id="stateHint">点击连接</div>
          </div>
        </div>
      </button>
    </div>
    <div class="badge" id="badge"><span class="dot"></span><span id="badgeText">已断开</span></div>

    <div class="rows" style="margin-top:14px">
      <div class="row clickable" id="rowNode"><span class="k">节点</span><span class="v" id="rNode">—</span></div>
      <div class="row"><span class="k">隧道流量</span><span class="v" id="rTraffic">—</span></div>
      <div class="row"><span class="k">连通检测</span><span class="v" id="rNet">—</span></div>
      <div class="row clickable" id="rowDetail"><span class="k">连接详情</span><span class="v">分配地址 · 网卡 · 网关 · 路由</span></div>
    </div>
    <div class="notice-row"><div class="notice" id="notice"></div><button class="copybtn" id="copyNotice" hidden title="复制错误与诊断信息">复制</button></div>
    <div class="login" id="loginBox" hidden>
      <button class="btn primary" id="btnLogin">使用浏览器登录</button>
      <div class="hint2" id="loginHint">在浏览器里用订阅邮箱完成验证后，客户端会自动登录</div>
    </div>
  </main>

  <section id="settings">
    <div class="s-head">
      <button class="back" id="back" title="返回">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <h2>首选项</h2>
    </div>
    <div class="group">
      <div class="group-title">账号</div>
      <div class="field"><label>面板地址</label><input id="fAPI" placeholder="https://panel.example.com"></div>
      <div class="field"><label>门户令牌</label><input id="fToken" placeholder="粘贴门户登录令牌"></div>
      <div class="row flat"><span class="k">当前在线时长</span><span class="v" id="rDur">—</span></div>
    </div>

    <div class="group">
      <div class="group-title">安全</div>
      <label class="check"><input type="checkbox" id="fInsecure"> 跳过节点证书校验</label>
      <label class="check"><input type="checkbox" id="fKillSwitch"> 断线保护（阻断隧道外流量）</label>
      <div class="hint2">开启后若客户端异常退出会暂时无法上网，重新打开客户端会自动恢复。</div>
    </div>

    <div class="group">
      <div class="group-title">诊断</div>
      <div class="field"><label>客户端日志</label><input id="fLogPath" readonly placeholder="加载中…"></div>
      <button class="btn ghost" id="openLogs">打开日志文件夹</button>
      <button class="btn ghost" id="btnRepair">修复网络（清理残留路由/DNS）</button>
    </div>

    <button class="btn primary" id="save">保存</button>
    <button class="btn danger" id="btnLogout">退出登录</button>
  </section>

  <section id="details">
    <div class="s-head">
      <button class="back" id="backDetail" title="返回">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <h2>连接详情</h2>
    </div>
    <div class="rows">
      <div class="row"><span class="k">分配地址</span><span class="v" id="rIP">—</span></div>
      <div class="row"><span class="k">虚拟网卡</span><span class="v" id="rAdapter">—</span></div>
      <div class="row"><span class="k">网关</span><span class="v" id="rGW">—</span></div>
      <div class="row"><span class="k">接管路由</span><span class="v" id="rRoutes">—</span></div>
      <div class="row"><span class="k">接管状态</span><span class="v" id="rTakeover">—</span></div>
      <div class="row"><span class="k">DNS 泄露防护</span><span class="v" id="rDnsGuard">—</span></div>
      <div class="row"><span class="k">IPv6 泄露防护</span><span class="v" id="rIPv6Guard">—</span></div>
      <div class="row"><span class="k">断线保护</span><span class="v" id="rKillSwitch">—</span></div>
      <div class="row"><span class="k">隧道采样</span><span class="v" id="rQuality">—</span></div>
      <div class="row"><span class="k">丢包计数</span><span class="v" id="rLoss">—</span></div>
    </div>
    <div class="notice" id="noticeDetail"></div>
    <div class="detail-actions">
      <button class="copybtn wide" id="copyDiag">复制诊断信息</button>
      <button class="copybtn wide" id="copyLogs">复制最近日志</button>
    </div>
  </section>

  <section id="installer">
    <div class="inst-head">
      <h2 id="instTitle">安装 ProxyPilot</h2>
    </div>
    <div class="inst-sub" id="instSub">
      首次使用需要先完成安装：复制程序、安装 Wintun 驱动并注册虚拟网卡。
    </div>

    <div class="inst-box" id="instForm">
      <div class="inst-field">
        <label>安装位置</label>
        <input id="instDir" placeholder="C:\Users\...\Programs\ProxyPilot">
      </div>
      <label class="inst-check"><input type="checkbox" id="instAutostart" checked> 开机后台运行（托盘常驻，不弹窗口）</label>
      <label class="inst-check"><input type="checkbox" id="instShortcut" checked> 创建开始菜单与桌面快捷方式</label>
    </div>

    <div class="inst-box" id="instProgress" hidden>
      <div class="inst-bar"><i id="instBarFill"></i></div>
      <div class="inst-steps" id="instSteps"></div>
      <div class="inst-msg" id="instMsg"></div>
    </div>

    <div class="inst-actions" id="instActions">
      <button class="btn primary" id="instStart">开始安装</button>
      <button class="btn" id="instCancel">退出</button>
    </div>

    <div class="inst-actions" id="instDoneActions" hidden>
      <button class="btn primary" id="instLaunch">立即启动</button>
      <button class="btn" id="instClose">关闭</button>

</div>

<!-- 所有浮层放在 .app 之外，避免被布局/裁切影响 -->
<div id="nodePicker" class="sheet" hidden>
  <div class="sheet-mask" data-close="1"></div>
  <div class="sheet-body">
    <div class="sheet-head">
      <div>
        <b>选择节点</b>
        <div class="sheet-sub">连接后切换会立即重连</div>
      </div>
      <button class="sheet-close" id="pickerClose" title="关闭">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="sheet-list" id="pickerList"></div>
  </div>
</div>

<div id="uiDialog" class="sheet" hidden>
  <div class="sheet-mask" data-close="1"></div>
  <div class="sheet-body dialog">
    <div class="dialog-icon" id="dlgIcon"></div>
    <div class="dialog-title" id="dlgTitle">提示</div>
    <div class="dialog-text" id="dlgText"></div>
    <div class="dialog-actions">
      <button class="btn" id="dlgCancel">取消</button>
      <button class="btn primary" id="dlgOk">确定</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script>
const $ = (id) => document.getElementById(id);
let state = {}, nodes = [], selectedNode = 0, view = 'main';
let selectedSynced = false;

const fmtDur = (s)=>{ s=Math.max(0,s|0); const h=(s/3600)|0,m=((s%3600)/60)|0,x=s%60;
  return (h?h+':':'')+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0'); };


// ---------- 复制错误 / 诊断信息 ----------
// 报障时用户只需要点一下，把整段贴过来即可，避免来回问细节。
async function copyText(text, okMsg){
  if(!text){ uiToast('没有可复制的内容', 'error'); return; }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
    }else{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    uiToast(okMsg || '已复制', 'ok');
  }catch(e){
    uiToast('复制失败：' + (e && e.message ? e.message : e), 'error');
  }
}

function fmtQuality(st){
  const q = st.tunnel_quality;
  if (!q || !q.sent) return '-';
  return q.ok + '/' + q.sent + ' 成功，丢 ' + q.lost +
    '（' + (q.loss_pct == null ? 0 : q.loss_pct.toFixed(1)) + '%）' +
    '，最近 ' + (q.last_rtt_ms || '-') + ' ms，最大 ' + (q.max_rtt_ms || '-') + ' ms' +
    (q.consecutive_fail ? ('，连续失败 ' + q.consecutive_fail) : '');
}

function diagText(){
  const st = state || {};
  const lines = [
    'ProxyPilot 客户端 v' + (st.version || '?'),
    '时间        : ' + new Date().toISOString(),
    '状态        : ' + (st.status || '-') + (st.message ? ('（' + st.message + '）') : ''),
    '节点        : ' + (st.node_name || '-') + '  ' + (st.node_host || ''),
    '选中节点ID  : ' + (st.selected_node || '-') + '   会话节点ID: ' + (st.node_id || '-'),
    '分配地址    : ' + (st.ip4 || '-'),
    '网关        : ' + (st.gateway || '-'),
    '虚拟网卡    : ' + (st.adapter || '-'),
    'MTU         : ' + (st.mtu || '-'),
    '数据面      : ' + (st.probe_ok ? '正常' : (st.net_error ? '不通' : '检测中')) + '  ' + (st.probe_info || ''),
    '连通检测    : ' + (st.net_ok ? ('通 ' + st.net_rtt_ms + ' ms') : (st.net_error || '检测中')),
    '接管错误    : ' + (st.tun_error || '-'),
    'RTT         : ' + (st.rtt_ms || '-') + ' ms',
    '流量        : ↓' + (st.rx || 0) + ' B  ↑' + (st.tx || 0) + ' B',
    'DNS 防护    : ' + ((st.dns_guard || []).join(', ') || '-'),
    'IPv6 防护   : ' + ((st.ipv6_guard || []).join(', ') || '-'),
    '断线保护    : ' + ((st.kill_switch_rules || []).join(', ') || '-'),
    '路由        : ' + ((st.routes || []).join(' | ') || '-'),
    '面板        : ' + (st.api || '-'),
    '登录        : ' + (st.logged_in ? ('是（' + (st.token_hint || '') + '）') : '否'),
    '隧道采样    : ' + fmtQuality(st),
    '上行队列丢包: ' + (st.uplink_dropped == null ? '-' : st.uplink_dropped) + ' 个',
    'QUIC 丢包   : ' + (st.quic_lost == null ? '-' : st.quic_lost + ' / ' + st.quic_sent +
      '（' + (st.quic_loss_pct == null ? '0' : st.quic_loss_pct.toFixed(2)) + '%）'),
    '节点数      : ' + (st.nodes_count == null ? '-' : st.nodes_count) +
      (st.nodes_error ? ('（拉取失败：' + st.nodes_error + '）') : ''),
    '错误        : ' + (st.net_error || st.tun_error || st.message || '-'),
  ];
  return lines.join('\n');
}

async function copyLogs(){
  try{
    const r = await fetch('/api/logs?since=0');
    const j = await r.json();
    const lines = (j && j.lines) || [];
    const text = lines.map((l)=> (typeof l === 'string' ? l : JSON.stringify(l))).join('\n');
    await copyText(text.slice(-20000), '已复制最近日志');
  }catch(e){
    uiToast('读取日志失败：' + (e && e.message ? e.message : e), 'error');
  }
}

$('copyNotice').onclick = ()=> copyText(diagText(), '已复制诊断信息');
$('copyDiag').onclick   = ()=> copyText(diagText(), '已复制诊断信息');
$('copyLogs').onclick   = copyLogs;

function render(){
  const st = state.status || 'idle';
  const dial = $('dial');
  dial.className = 'dial' + (st==='connected'?' on':st==='connecting'?' busy':st==='error'?' err':'');

  $('stateText').textContent = st==='connected'?'已连接':st==='connecting'?'连接中':st==='error'?'连接失败':'未连接';
  $('stateHint').textContent = st==='connected'?'点击断开':st==='connecting'?'请稍候…':'点击连接';

  const badge = $('badge');
  const probeFailed = st==='connected' && !state.probe_ok && !!state.net_error;
  badge.className = 'badge' + (st==='connected'?(probeFailed?' err':' on'):st==='connecting'?' busy':st==='error'?' err':'');
  const rttText = state.rtt_ms ? (' · ' + state.rtt_ms + ' ms') : '';
  $('badgeText').textContent = st==='connected'
    ? ('已连接 · ' + (state.probe_ok ? '数据面正常' : (probeFailed ? '数据面不通' : '探测中')) + rttText)
    : st==='connecting' ? '正在建立会话' : st==='error' ? '连接异常' : '已断开';

  // 节点显示优先级：
  //   1. 选中的节点就是当前会话节点 → 显示真实节点 + MTU
  //   2. 已选中别的节点（连接中/已连接）→ 立刻显示「待切换」，不必等点了连接
  //   3. 未连接 → 显示选中的节点「待连接」
  //   4. 都没有 → 兜底显示会话节点
  const pickedNode = nodes.find((x) => x.id === selectedNode);
  const activeNodeId = Number(state.node_id) || 0;
  const live = (st === 'connected' || st === 'connecting');
  const pickedName = pickedNode ? (pickedNode.name || ('#' + pickedNode.id)) : '';
  if (live && selectedNode && selectedNode !== activeNodeId) {
    $('rNode').textContent = pickedName + '（待切换）';
    $('rNode').className = 'v warn';
  } else if (state.node_name && (!selectedNode || selectedNode === activeNodeId)) {
    $('rNode').textContent = state.node_name + (state.mtu ? (' · MTU ' + state.mtu) : '');
    $('rNode').className = 'v';
  } else if (pickedNode) {
    $('rNode').textContent = pickedName + '（待连接）';
    $('rNode').className = 'v';
  } else if (state.node_name) {
    $('rNode').textContent = state.node_name + (state.mtu ? (' · MTU ' + state.mtu) : '');
    $('rNode').className = 'v';
  } else {
    $('rNode').textContent = state.logged_in ? '点击选择' : '未登录';
    $('rNode').className = 'v';
  }
  $('rIP').textContent = state.ip4 || '—';
  $('rDur').textContent = state.duration ? fmtDur(state.duration) : '—';
  $('rGW').textContent = state.gateway || '—';
  const tk = $('rTakeover');
  if (tk) {
    if (state.tun_error) { tk.textContent = '未接管：' + state.tun_error; tk.className = 'v bad'; }
    else if (state.adapter) { tk.textContent = '已接管（全局流量）'; tk.className = 'v ok'; }
    else { tk.textContent = st === 'connected' ? '准备中…' : '未连接'; tk.className = 'v'; }
  }

  const fmtBytes = (n)=>{ n=Number(n||0); if(n<1024) return n+' B'; if(n<1048576) return (n/1024).toFixed(1)+' KB'; return (n/1048576).toFixed(2)+' MB'; };
  $('rTraffic').textContent = (state.rx||state.tx) ? ('↓'+fmtBytes(state.rx)+' ↑'+fmtBytes(state.tx)) : '—';
  const netRow = $('rNet');
  if(st === 'idle'){ netRow.textContent = '—'; netRow.className = 'v'; netRow.title = ''; }
  else if(state.net_ok){ netRow.textContent = '通 · ' + state.net_rtt_ms + ' ms'; netRow.className = 'v ok'; netRow.title = state.probe_info || ''; }
  else if(state.net_error){ netRow.textContent = '不通'; netRow.className = 'v bad'; netRow.title = state.net_error; }
  else { netRow.textContent = '检测中…'; netRow.className = 'v'; netRow.title = ''; }
  $('rAdapter').textContent = state.adapter || (state.tun_error ? '接管失败' : '—');
  $('rAdapter').className = 'v' + (state.adapter ? ' ok' : state.tun_error ? ' bad' : '');
  if ($('rQuality')) $('rQuality').textContent = fmtQuality(state);
  if ($('rLoss')) {
    const d = (state.uplink_dropped == null) ? '-' : state.uplink_dropped;
    const ql = (state.quic_lost == null) ? '-' : state.quic_lost;
    $('rLoss').textContent = st === 'connected' ? ('队列丢 ' + d + ' · QUIC 丢 ' + ql) : '—';
  }
  const routes = state.routes || [];
  $('rRoutes').textContent = routes.length ? (routes.length + ' 条：' + routes.slice(0,3).join('、') + (routes.length>3?' …':'')) : '—';
  $('rRoutes').title = routes.join('\n');

  // 只有存在错误或探测失败时才提供「复制」
  const errText = (st==='error' ? state.message : '') || state.tun_error || state.net_error || '';
  const cb = $('copyNotice');
  if(cb) cb.hidden = !errText;

  const n = $('notice');

  if(st==='error' && state.message){ n.textContent = state.message; }
  else if(st==='connected' && !state.probe_ok && state.net_error){ n.textContent = '数据面不通：' + state.net_error; }
  else if(st==='connected' && !state.probe_ok){ n.textContent = '会话已建立，正在验证数据面…'; }
  else if(st==='connected' && state.tun_error){ n.textContent = '系统网络未接管：' + state.tun_error; }
  else { n.textContent = ''; }

  const dg = $('rDnsGuard');
  if (dg) {
    const items = state.dns_guard || [];
    if (items.length) { dg.textContent = '已启用（' + items.length + ' 项）'; dg.className = 'v ok'; }
    else { dg.textContent = st === 'connected' ? '未启用' : '—'; dg.className = 'v'; }
    dg.title = items.join('\n');
  }

  const v6 = $('rIPv6Guard');
  if (v6) {
    const list = state.ipv6_guard || [];
    if (list.length) { v6.textContent = '已封禁（' + list.join('、') + '）'; v6.className = 'v ok'; }
    else { v6.textContent = st === 'connected' ? '未封禁' : '—'; v6.className = 'v'; }
  }

  const ks = $('rKillSwitch');
  if (ks) {
    const rules = state.kill_switch_rules || [];
    if (rules.length) { ks.textContent = '已启用（' + rules.length + ' 条白名单）'; ks.className = 'v ok'; }
    else if (state.kill_switch) { ks.textContent = st === 'connected' ? '未生效' : '未连接'; ks.className = 'v'; }
    else { ks.textContent = '未开启'; ks.className = 'v'; }
  }

  const nd = $('noticeDetail');
  if (nd) nd.textContent = (st === 'error' && state.message) ? state.message : '';

  $('footVer').textContent = 'ProxyPilot v' + (state.version||'');
  $('footAPI').textContent = state.api ? state.api.replace(/^https?:\/\//,'') : '';

  const logged = !!state.logged_in;
  $('loginBox').hidden = logged;
  if(!logged){
    $('stateText').textContent = '未登录';
    $('stateHint').textContent = '请先登录';
    $('badgeText').textContent = '未登录';
    $('badge').className = 'badge';
  }
}

async function poll(){
  try{
    const r = await fetch('/api/state',{cache:'no-store'});
    state = await r.json();
    if(!selectedSynced && state.selected_node){
      selectedNode = Number(state.selected_node) || 0;
      selectedSynced = true;
      loadNodes();
    }
    render();
  }catch(e){}
}

let lastNodesError = '';
async function loadNodes(){
  try{
    const r = await fetch('/api/nodes',{cache:'no-store'});
    if(!r.ok){ throw new Error('本机服务返回 HTTP ' + r.status); }
    const d = await r.json();
    nodes = d.nodes || [];
    lastNodesError = nodes.length ? '' : (d.error ||
      '面板返回 0 个节点：该账号还没有被授权任何节点，或授权已停用');
  }catch(e){
    nodes = [];
    lastNodesError = '获取节点失败：' + (e && e.message ? e.message : e);
  }
  // 渲染统一交给 renderPicker：节点列表只存在于弹层里（#pickerList）
  renderPicker();
}

// 节点获取失败时复制的文本：带上关键上下文，便于定位
function nodeErrorText(){
  return [
    'ProxyPilot 客户端 v' + ((state && state.version) || '?'),
    '时间     : ' + new Date().toISOString(),
    '面板     : ' + ((state && state.api) || '-'),
    '登录     : ' + (state && state.logged_in ? '是' : '否'),
    '状态     : ' + ((state && state.status) || '-'),
    '错误     : ' + (lastNodesError || '-'),
  ].join('\n');
}

function escapeHtml(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// 切换节点：写回后端记忆；若正在连接/已连接则自动用新节点重连
$('rowNode').onclick = async ()=>{
  if (!state.logged_in) { openSettings(); return; }
  openPicker(true);
};
$('pickerClose').onclick = ()=> openPicker(false);
$('rowDetail').onclick = ()=> openDetails();
$('backDetail').onclick = ()=> closeSettings();

async function pickNode(id){
  if(!id) return;
  if (id === selectedNode) return;
  const wasLive = (state.status==='connected' || state.status==='connecting');
  selectedNode = id;
  render();                       // 先刷新界面，用户立刻看到「待切换」
  try{
    await fetch('/api/select-node',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({node_id:id})});
  }catch(e){ /* 记忆失败不影响本次选择 */ }
  // 已连接状态下切换节点 → 自动切到新节点，不用再点「连接」
  if (wasLive) {
    uiToast('正在切换到 ' + ((nodes.find(x=>x.id===id)||{}).name || ('#'+id)) + '…', 'info');
    try{
      const res = await fetch('/api/connect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({node_id:id})});
      const j = await res.json().catch(()=>({}));
      if (j && j.ok === false) uiToast('切换失败：' + (j.error||'未知错误'), 'error');
    }catch(e){ uiToast('切换失败：' + e.message, 'error'); }
    setTimeout(poll, 250);
  }
}

// 渲染「选择节点」弹层
// ---------- 页内对话框与提示（替代原生 confirm/alert） ----------
// 原生 confirm/alert 在窗口隐藏或失焦时可能弹在看不见的地方，用户会以为「点了没反应」。
let dlgResolve = null;
function uiDialogOpen({title='提示', text='', okText='确定', cancelText=null, tone=''}){
  return new Promise((resolve)=>{
    dlgResolve = resolve;
    $('dlgTitle').textContent = title;
    $('dlgText').textContent = text;
    const icon = $('dlgIcon');
    icon.className = 'dialog-icon' + (tone ? ' ' + tone : '');
    icon.textContent = tone === 'danger' ? '!' : tone === 'warn' ? '!' : 'i';
    $('dlgOk').textContent = okText;
    const cancel = $('dlgCancel');
    cancel.hidden = !cancelText;
    if (cancelText) cancel.textContent = cancelText;
    $('uiDialog').hidden = false;
    setTimeout(()=>$('dlgOk').focus(), 30);
  });
}
function uiConfirm(text, {title='确认操作', okText='确定', tone='warn'}={}){
  return uiDialogOpen({title, text, okText, cancelText:'取消', tone}).then(v=>v===true);
}
function uiAlert(text, {title='提示', tone=''}={}){
  return uiDialogOpen({title, text, okText:'知道了', cancelText:null, tone}).then(()=>true);
}
$('dlgOk').onclick = ()=>{ const r = dlgResolve; dlgResolve = null; $('uiDialog').hidden = true; if (r) r(true); };
$('dlgCancel').onclick = ()=>{ const r = dlgResolve; dlgResolve = null; $('uiDialog').hidden = true; if (r) r(false); };
document.querySelector('#nodePicker .sheet-mask').onclick = ()=> openPicker(false);
document.querySelector('#uiDialog .sheet-mask').onclick = ()=>{
  const r = dlgResolve; dlgResolve = null; $('uiDialog').hidden = true; if (r) r(false);
};
window.addEventListener('keydown', (e)=>{
  if (e.key !== 'Escape') return;
  if (!$('uiDialog').hidden) { $('dlgCancel').click(); return; }
  if (!$('nodePicker').hidden) openPicker(false);
});

let toastTimer = null;
function uiToast(msg, kind='ok'){
  const el = $('toast');
  if (!el) return;
  el.textContent = msg;
  el.className = 'toast ' + kind;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.hidden = true; }, 2600);
}

function renderPicker(){
    const list = $('pickerList');
    if (!list) return;
    if (!nodes.length) {
      const msg = lastNodesError || '没有可用节点';
      list.innerHTML =
        '<div class="sheet-row" style="display:block"><span class="nm" style="color:#f43f5e;line-height:1.6">'
        + escapeHtml(msg) + '</span></div>'
        + '<div class="sheet-row nacts">'
        + '<button class="copybtn" id="nodesRetry">重试</button>'
        + '<button class="copybtn" id="nodesCopy">复制错误</button></div>';
      const rb = $('nodesRetry'); if(rb) rb.onclick = ()=> { rb.textContent = '重试中…'; loadNodes(); };
      const cb = $('nodesCopy'); if(cb) cb.onclick = ()=> copyText(nodeErrorText(), '已复制节点错误');
      return;
    }
  list.innerHTML = nodes.map((n)=>`
    <div class="sheet-row ${n.id===selectedNode?'sel':''}" data-id="${n.id}">
      <span class="dot ${n.online?'up':''}"></span>
      <span class="nm">${n.name||('#'+n.id)}</span>
      <span class="ep">${(n.endpoint||'').split(':')[0]||''}</span>
    </div>`).join('');
  list.querySelectorAll('.sheet-row[data-id]').forEach((el)=>{
    el.onclick = async ()=>{ openPicker(false); await pickNode(Number(el.dataset.id)); };
  });
}

function openPicker(on){
  const box = $('nodePicker');
  if (!box) return;
  box.hidden = !on;
  if (on) { renderPicker(); loadNodes(); }
}

async function toggle(){
  if(!state.logged_in){ const b = $('btnLogin'); if(b) b.click(); return; }
  if(state.status==='connected' || state.status==='connecting'){
    await fetch('/api/disconnect',{method:'POST'}); setTimeout(poll,250); return;
  }
  await fetch('/api/connect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({node_id:selectedNode})});
  setTimeout(poll,250);
}

function openSettings(){
  view='settings';
  $('main').classList.add('hide'); $('settings').classList.add('show');
  $('fAPI').value = state.api || '';
  $('fToken').value = '';
  $('fToken').placeholder = state.logged_in ? ('已保存：'+state.token_hint) : '粘贴门户登录令牌';
  $('fInsecure').checked = !!state.insecure;
  if ($('fKillSwitch')) $('fKillSwitch').checked = !!state.kill_switch;
  $('fLogPath').value = state.log_path || '';
}
function closeSettings(){
  view='main'; $('settings').classList.remove('show'); $('details').classList.remove('show');
  if(!$('installer').classList.contains('show')) $('main').classList.remove('hide');
}

function openDetails(){
  view='details';
  $('main').classList.add('hide'); $('settings').classList.remove('show'); $('details').classList.add('show');
  render();
}

// ---------------- 安装向导 ----------------
let instTimer = null;

function showInstaller(show){
  $('installer').classList.toggle('show', show);
  $('gear').style.display = show ? 'none' : '';
  $('main').classList.toggle('hide', show);
  $('settings').classList.remove('show');
}

function renderSteps(st){
  const box = $('instSteps');
  const steps = st.steps || [];
  if(!box.dataset.init || box.children.length !== steps.length){
    box.innerHTML = steps.map(s=>`<div class="inst-step" data-k="${s.key}"><span class="inst-dot"></span><span>${s.label}</span></div>`).join('');
    box.dataset.init = '1';
  }
  let doneCount = 0;
  steps.forEach(s=>{
    const el = box.querySelector(`[data-k="${s.key}"]`);
    if(!el) return;
    el.className = 'inst-step' + (s.error ? ' err' : s.done ? ' done' : (st.running ? ' active' : ''));
    el.querySelector('.inst-dot').textContent = s.error ? '!' : s.done ? '✓' : '';
    if(s.done) doneCount++;
  });
  const pct = steps.length ? Math.round(doneCount / steps.length * 100) : 0;
  $('instBarFill').style.width = pct + '%';
  const msg = $('instMsg');
  msg.className = 'inst-msg' + (st.failed ? ' err' : st.finished ? ' ok' : '');
  msg.textContent = st.message || '';
}

async function pollInstall(){
  try{
    const r = await fetch('/api/install/status', {cache:'no-store'});
    const st = await r.json();
    renderSteps(st);
    if(st.finished){
      clearInterval(instTimer); instTimer = null;
      if(st.failed){
        // 失败：退回表单，允许重试
        $('instForm').hidden = false;
        $('instActions').hidden = false;
        $('instDoneActions').hidden = true;
        $('instProgress').hidden = false;
        $('instStart').disabled = false;
        $('instStart').textContent = '重试安装';
        $('instTitle').textContent = '安装未完成';
        $('instSub').textContent = '请按上面的提示处理后重试。';
      } else {
        $('instActions').hidden = true;
        $('instDoneActions').hidden = false;
        $('instProgress').hidden = false;
        $('instForm').hidden = true;
        $('instTitle').textContent = '安装完成';
        $('instSub').textContent = '虚拟网卡：' + (st.adapter || 'ProxyPilot VPN') + '　安装目录：' + (st.install_to || '');
      }
    }
  }catch(e){}
}

function startInstallPolling(){
  if(instTimer) clearInterval(instTimer);
  instTimer = setInterval(pollInstall, 600);
}

$('instStart').onclick = async ()=>{
  $('instStart').disabled = true;
  $('instForm').hidden = true;
  $('instProgress').hidden = false;
  $('instTitle').textContent = '正在安装';
  $('instSub').textContent = '请稍候，安装过程约需 3-10 秒。';
  try{
    const r = await fetch('/api/install/start',{method:'POST',headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        dir: $('instDir').value.trim(),
        autostart: $('instAutostart').checked,
        shortcuts: $('instShortcut').checked,
      })});
    const d = await r.json();
    if(!d.ok){ $('instMsg').textContent = d.error || '启动安装失败'; $('instMsg').className = 'inst-msg err'; $('instStart').disabled = false; return; }
    startInstallPolling();
  }catch(e){
    $('instMsg').textContent = '请求失败：' + e.message;
    $('instMsg').className = 'inst-msg err';
    $('instStart').disabled = false;
  }
};

$('instCancel').onclick = async ()=>{
  try{ await fetch('/api/install/exit',{method:'POST'}); }catch(e){}
};
$('instClose').onclick = async ()=>{
  try{ await fetch('/api/install/exit',{method:'POST'}); }catch(e){}
};
$('instLaunch').onclick = async ()=>{
  try{
    const r = await fetch('/api/install/launch',{method:'POST'});
    const d = await r.json();
    if(!d.ok){ $('instMsg').textContent = d.error || '启动失败'; $('instMsg').className = 'inst-msg err'; }
  }catch(e){}
};

async function initInstaller(){
  try{
    const r = await fetch('/api/install/status',{cache:'no-store'});
    const st = await r.json();
    // 安装程序构建（URL 带 installer=1）始终显示向导，即使是重装/修复
    const forceInstaller = new URLSearchParams(location.search).get('installer') === '1';
    if(st.installed && !forceInstaller){ showInstaller(false); return; }
    if(forceInstaller){ $('instTitle').textContent = '安装 ProxyPilot v' + (st.version||''); }
    showInstaller(true);
    $('instDir').value = st.default_dir || '';
    $('instSub').textContent = st.is_admin
      ? '首次使用需要先完成安装：复制程序、安装 Wintun 驱动并注册虚拟网卡。'
      : '首次使用需要先完成安装；当前不是管理员，安装会失败，请以管理员身份运行。';
    if(st.running){ $('instForm').hidden = true; $('instProgress').hidden = false; startInstallPolling(); }
  }catch(e){}
}
initInstaller();

$('dial').onclick = toggle;
$('gear').onclick = openSettings;
$('back').onclick = closeSettings;

let loginTimer = null;
function loginPoll(code){
  loginTimer = setInterval(async ()=>{
    try{
      const r = await fetch('/api/login/poll?code='+encodeURIComponent(code),{cache:'no-store'});
      const d = await r.json();
      if(d.status === 'approved'){
        clearInterval(loginTimer); loginTimer = null;
        $('loginHint').textContent = '登录成功，正在同步…';
        await poll();
      } else if(d.status === 'expired'){
        clearInterval(loginTimer); loginTimer = null;
        $('loginHint').textContent = '授权码已过期，请重新点击登录';
      }
    }catch(e){}
  }, 2000);
}

$('btnRepair').onclick = async ()=>{
  if (!await uiConfirm('清理本机残留的隧道路由与 DNS 规则？\n适用于「断开后上不了网」的情况。',
      {title:'修复网络', okText:'开始清理'})) return;
  try {
    await fetch('/api/repair', { method:'POST' });
    await poll();
    uiToast('已清理完成，网络应恢复正常', 'ok');
  } catch(e) { uiToast('修复失败：'+e, 'err'); }
};

$('btnLogout').onclick = async ()=>{
  if (!await uiConfirm('退出登录？本机保存的门户令牌会被清除。',
      {title:'退出登录', okText:'退出', tone:'danger'})) return;
  try {
    await fetch('/api/logout', { method:'POST' });
    await poll();
    closeSettings();
    uiToast('已退出登录', 'ok');
  } catch(e) { uiToast('退出失败：'+e, 'err'); }
};

$('btnLogin').onclick = async ()=>{
  $('btnLogin').disabled = true;
  $('loginHint').textContent = '正在打开浏览器授权页…';
  try{
    const r = await fetch('/api/login/start',{method:'POST'});
    const d = await r.json();
    if(!d.ok){ $('loginHint').textContent = '打开授权页失败：'+(d.error||'未知错误'); }
    else {
      $('loginHint').textContent = '已打开浏览器，请在页面里完成邮箱验证';
      loginPoll(d.code);
    }
  }catch(e){ $('loginHint').textContent = '请求失败：'+e.message; }
  $('btnLogin').disabled = false;
};
$('openLogs').onclick = async ()=>{ try{ await fetch('/api/logs/open',{method:'POST'}); }catch(e){} };
$('save').onclick = async ()=>{
  try{
    const r = await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      api: $('fAPI').value.trim(),
      token: $('fToken').value.trim(),
      insecure: $('fInsecure').checked,
      kill_switch: $('fKillSwitch') ? $('fKillSwitch').checked : false
    })});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    await poll(); closeSettings();
    uiToast('设置已保存', 'ok');
  }catch(e){ uiToast('保存失败：' + (e.message||e), 'err'); }
};

poll(); loadNodes();
setInterval(poll, 1000);
</script>
